# Trivy secret-scanner allow rules (used by `make audit` / scripts/audit.sh,
# which ci.yml's security job also runs). Each entry is a narrowly-scoped,
# reviewed false positive — path AND content regex must both match. Never add
# a bare rule id.
allow-rules:
  # web/src/pages/IAM.tsx GCP/Google service-account <textarea> placeholder
  # text (JSON skeleton with "..." values) — a UI hint, not a key.
  - id: iam-sa-key-placeholder
    description: GCP service-account JSON placeholder in IAM credential form
    path: web/src/pages/IAM\.tsx
    regex: 'placeholder=.\{"type": "service_account", "project_id": "\.\.\.", \.\.\.\}.'
