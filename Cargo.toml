[workspace]
resolver = "2"
members = [
    "crates/elder-sdk",
    "crates/elder-svc-common",
    "crates/elder-int-workmgmt",
    "crates/elder-int-cloud",
    "crates/elder-int-identity",
    "services/svc-scanner",
    "services/svc-integrations",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
