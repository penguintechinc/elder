{{- range $component := list "postgres" "redis" "hub-webui" "hub-api" "hub-mcp" "svc-worker" }}
{{- $componentConfig := index $.Values $component }}
{{- if and $componentConfig $componentConfig.enabled }}
{{- if $componentConfig.service }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "elder.componentResourceName" (list $component $) }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "elder.componentLabels" (list $component $) | nindent 4 }}
spec:
  type: {{ $componentConfig.service.type | default "ClusterIP" }}
  ports:
  {{- if eq $component "postgres" }}
  - port: {{ $componentConfig.service.port }}
    targetPort: 5432
    protocol: TCP
    name: postgres
  {{- else if eq $component "redis" }}
  - port: {{ $componentConfig.service.port }}
    targetPort: 6379
    protocol: TCP
    name: redis
  {{- else if eq $component "hub-webui" }}
  - port: {{ $componentConfig.service.port }}
    targetPort: {{ $componentConfig.service.targetPort }}
    protocol: TCP
    name: http
    {{- if and (eq ($componentConfig.service.type | default "ClusterIP") "NodePort") $componentConfig.service.nodePort }}
    nodePort: {{ $componentConfig.service.nodePort }}
    {{- end }}
  {{- else if eq $component "hub-api" }}
  - port: {{ $componentConfig.service.port }}
    targetPort: {{ $componentConfig.service.targetPort }}
    protocol: TCP
    name: http
    {{- if and (eq ($componentConfig.service.type | default "ClusterIP") "NodePort") $componentConfig.service.nodePort }}
    nodePort: {{ $componentConfig.service.nodePort }}
    {{- end }}
  - port: {{ $componentConfig.service.grpcPort }}
    targetPort: {{ $componentConfig.service.grpcPort }}
    protocol: TCP
    name: grpc
  {{- else if eq $component "hub-mcp" }}
  - port: {{ $componentConfig.service.port | default 8080 }}
    targetPort: {{ $componentConfig.service.targetPort | default 8080 }}
    protocol: TCP
    name: http
    {{- if and (eq ($componentConfig.service.type | default "ClusterIP") "NodePort") $componentConfig.service.nodePort }}
    nodePort: {{ $componentConfig.service.nodePort }}
    {{- end }}
  {{- else if eq $component "svc-worker" }}
  - port: {{ $componentConfig.service.port }}
    targetPort: {{ $componentConfig.service.targetPort }}
    protocol: TCP
    name: http
  {{- end }}
  selector:
    {{- include "elder.componentSelectorLabels" (list $component $) | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}

{{- $hubApi := index .Values "hub-api" -}}
{{- if not $hubApi.service }}
---
apiVersion: v1
kind: Service
metadata:
  name: hub-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "elder.componentLabels" (list "hub-api" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  - port: 50051
    targetPort: 50051
    protocol: TCP
    name: grpc
  selector:
    {{- include "elder.componentSelectorLabels" (list "hub-api" .) | nindent 4 }}
{{- end }}
