{{/*
Namespace-wide default-deny + explicit allows (Cilium) — release audit
finding #2. devops-kubernetes.md NetworkPolicy: every cluster targets
Cilium as CNI, so this is CiliumNetworkPolicy, never plain
networking.k8s.io/v1 NetworkPolicy. Gated behind networkPolicy.enabled so
alpha (local MicroK8s, no Cilium CRDs installed today) can opt out — see
alpha.yml.

flows-invoker is EXCLUDED from every "allow" policy below (but still
covered by the deny-all baseline). It already ships its own tighter,
dedicated policy (networkpolicy-flows-invoker.yaml: deny all ingress,
egress restricted to DNS/Postgres/Redis/HTTPS-minus-private-ranges) because
it executes arbitrary user-sandboxed CI commands. Cilium unions all
policies selecting a pod, so folding it into the broader same-namespace/
DNS/datastore allows here would silently widen that deliberate lockdown.
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- $notFlowsInvoker := list (dict "key" "app.kubernetes.io/component" "operator" "NotIn" "values" (list "svc-flows-invoker" "hub-mcp" "svc-runworker")) }}
---
# Baseline: deny all ingress + egress for every pod in the namespace unless
# a more specific allow policy below (or flows-invoker's own policy) grants it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "elder.fullname" . }}-default-deny
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "elder.labels" . | nindent 4 }}
spec:
  endpointSelector: {}
  ingress: []
  egress: []
---
# Same-namespace pods are free to talk to each other in both directions
# (devops-kubernetes.md: "Same-namespace pods communicate freely").
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "elder.fullname" . }}-allow-same-namespace
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "elder.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchExpressions:
      {{- toYaml $notFlowsInvoker | nindent 6 }}
  ingress:
    - fromEndpoints:
        - matchLabels: {}
  egress:
    - toEndpoints:
        - matchLabels: {}
---
# DNS egress to CoreDNS/kube-dns in kube-system.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "elder.fullname" . }}-allow-dns-egress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "elder.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchExpressions:
      {{- toYaml $notFlowsInvoker | nindent 6 }}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Egress to this chart's own in-cluster Postgres + Redis Deployments.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "elder.fullname" . }}-allow-datastore-egress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "elder.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchExpressions:
      {{- toYaml $notFlowsInvoker | nindent 6 }}
  egress:
    - toEndpoints:
        - matchLabels:
            {{- include "elder.componentSelectorLabels" (list "postgres" .) | nindent 12 }}
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            {{- include "elder.componentSelectorLabels" (list "redis" .) | nindent 12 }}
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
# Egress to the OTLP collector (values.otel.endpoint, e.g.
# signoz-otel-collector). Referenced by bare Service name, which only
# resolves within this same namespace, so allow-same-namespace above
# already covers it — this rule keeps the allow explicit/auditable and
# scoped to the collector's actual port regardless.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "elder.fullname" . }}-allow-otel-egress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "elder.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchExpressions:
      {{- toYaml $notFlowsInvoker | nindent 6 }}
  egress:
    - toEndpoints:
        - matchLabels: {}
      toPorts:
        - ports:
            - port: {{ .Values.networkPolicy.otelCollectorPort | default 4318 | quote }}
              protocol: TCP
---
# Egress to PenguinTech license validation + PostHog feature-flag/analytics
# endpoints (critical-rules.md Feature Flags & License Tiers).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "elder.fullname" . }}-allow-license-posthog-egress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "elder.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchExpressions:
      {{- toYaml $notFlowsInvoker | nindent 6 }}
  egress:
    - toFQDNs:
        - matchName: {{ .Values.networkPolicy.licenseServerHost | default "license.penguintech.io" | quote }}
        - matchName: {{ .Values.networkPolicy.posthogHost | default "posthog.penguintech.cloud" | quote }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Egress from API pod to WaddleAI Ollama inference service on port 11434.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "elder.fullname" . }}-allow-ollama-egress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "elder.componentLabels" (list "hub-api" .) | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "elder.componentSelectorLabels" (list "hub-api" .) | nindent 6 }}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicy.ollamaNamespace | default "waddleai" }}
      toPorts:
        - ports:
            - port: {{ .Values.networkPolicy.ollamaPort | default 11434 | quote }}
              protocol: TCP
---
# Cross-namespace ingress: only the Cilium Gateway (httproute.yaml) reaches
# hub-webui/hub-api from outside this namespace, scoped to each component's own
# declared serving port(s) only (security.md: "External ingress scoped to
# the pod's actual serving port(s) only").
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "elder.fullname" . }}-allow-gateway-ingress-hub-webui
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "elder.componentLabels" (list "hub-webui" .) | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "elder.componentSelectorLabels" (list "hub-webui" .) | nindent 6 }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicy.gatewayNamespace | default "gateway" }}
      toPorts:
        - ports:
            - port: {{ (index .Values "hub-webui").service.targetPort | quote }}
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "elder.fullname" . }}-allow-gateway-ingress-hub-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "elder.componentLabels" (list "hub-api" .) | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "elder.componentSelectorLabels" (list "hub-api" .) | nindent 6 }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicy.gatewayNamespace | default "gateway" }}
      toPorts:
        - ports:
            - port: {{ (index .Values "hub-api").service.targetPort | quote }}
              protocol: TCP
            - port: {{ (index .Values "hub-api").service.grpcPort | quote }}
              protocol: TCP
---
# Egress strictly for svc-scanner CronJob pods: HTTPS git clone, HTTP
# screenshots, and active network/banner probing while blocking cloud IMDS
# metadata (169.254.169.254/32) and permitting zero external ingress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "elder.fullname" . }}-allow-svc-scanner-egress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "elder.componentLabels" (list "svc-scanner" .) | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "elder.componentSelectorLabels" (list "svc-scanner" .) | nindent 6 }}
  egress:
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 169.254.169.254/32
        - cidr: ::/0
---
# Egress strictly for svc-integrations CronJob pods: HTTPS/HTTP (SaaS, Cloud APIs,
# GitHub/GitLab/Jira/Linear/ServiceNow/Okta/Authentik/GWS/Vultr/FleetDM),
# LDAP/LDAPS (389/636), and Kubernetes APIs (6443/8443) while blocking cloud
# IMDS metadata (169.254.169.254/32) and permitting zero external ingress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "elder.fullname" . }}-allow-svc-integrations-egress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "elder.componentLabels" (list "svc-integrations" .) | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "elder.componentSelectorLabels" (list "svc-integrations" .) | nindent 6 }}
  egress:
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 169.254.169.254/32
        - cidr: ::/0
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
            - port: "636"
              protocol: TCP
            - port: "389"
              protocol: TCP
            - port: "6443"
              protocol: TCP
            - port: "8443"
              protocol: TCP
{{- end }}
