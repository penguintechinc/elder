{{/*
ServiceAccount used by every Elder workload (see elder.serviceAccountName in
_helpers.tpl, referenced from deployment.yaml serviceAccountName). Rendered
only when serviceAccount.create is true (default) — set to false to bind to
an externally managed ServiceAccount named via serviceAccount.name instead.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "elder.serviceAccountName" . }}
  labels:
    {{- include "elder.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
