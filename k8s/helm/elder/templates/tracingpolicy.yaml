{{/*
Tetragon runtime-execution allowlist (enforced Sigkill, not observe-only) —
release audit finding #3. Scoped per pod/service, not one global policy
(devops-kubernetes.md Cluster Security Baseline) — api/worker run
python3, web runs nginx (NOT node: web/Dockerfile's runtime stage is
nginxinc/nginx-unprivileged; node only exists in the discarded npm-build
stage), svc-scanning runs the compiled Rust binary plus masscan, git,
and Chromium headless binaries without any shell wrapper, and
svc-integrations runs strictly the compiled Rust binary without any shell wrapper.

flows-invoker is intentionally NOT covered: executing arbitrary
user-defined CI commands inside a process sandbox (apps/flows_invoker/
sandbox.py) is its actual product feature, not a compromise indicator —
this policy would break normal operation. Isolation there comes from the
sandbox plus networkpolicy-flows-invoker.yaml.

Gated behind tetragon.enabled so alpha (local MicroK8s, no Tetragon
DaemonSet/CRDs installed today) can opt out — see alpha.yml.
*/}}
{{- if .Values.tetragon.enabled }}
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: {{ include "elder.fullname" . }}-exec-allowlist-python
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["api", "worker"]
  kprobes:
    - call: "sys_execve"
      syscall: true
      args:
        - index: 0
          type: "string"
      selectors:
        - matchArgs:
            - index: 0
              operator: "NotEquals"
              values:
                - "/usr/local/bin/python3"
                - "/usr/local/bin/python"
          matchActions:
            - action: Sigkill
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: {{ include "elder.fullname" . }}-exec-allowlist-svc-scanning
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: svc-scanning
  kprobes:
    - call: "sys_execve"
      syscall: true
      args:
        - index: 0
          type: "string"
      selectors:
        - matchArgs:
            - index: 0
              operator: "NotEquals"
              values:
                - "/app/svc-scanning"
                - "/usr/bin/masscan"
                - "/usr/bin/git"
                - "/usr/lib/git-core/git"
                - "/usr/lib/git-core/git-remote-http"
                - "/usr/lib/git-core/git-remote-https"
                - "/usr/lib/chromium/chromium"
                - "/usr/lib/chromium/chrome_crashpad_handler"
          matchActions:
            - action: Sigkill
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: {{ include "elder.fullname" . }}-exec-allowlist-svc-integrations
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: svc-integrations
  kprobes:
    - call: "sys_execve"
      syscall: true
      args:
        - index: 0
          type: "string"
      selectors:
        - matchArgs:
            - index: 0
              operator: "NotEquals"
              values:
                - "/app/svc-integrations"
          matchActions:
            - action: Sigkill
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: {{ include "elder.fullname" . }}-exec-allowlist-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: web
  kprobes:
    - call: "sys_execve"
      syscall: true
      args:
        - index: 0
          type: "string"
      selectors:
        - matchArgs:
            - index: 0
              operator: "NotEquals"
              values:
                - "/usr/sbin/nginx"
          matchActions:
            - action: Sigkill
{{- end }}
