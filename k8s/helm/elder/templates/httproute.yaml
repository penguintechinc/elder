{{- if .Values.gateway.enabled -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "elder.fullname" . }}-routes
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
  - name: {{ ((.Values.gateway).parentRef).name | default "shared" }}
    namespace: {{ ((.Values.gateway).parentRef).namespace | default "gateway" }}
    sectionName: https
  hostnames:
  - {{ .Values.gateway.host | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    timeouts:
      request: {{ .Values.gateway.timeouts.request | default "300s" }}
    backendRefs:
    - name: hub-api
      port: 5000
  {{- $hubMcp := index .Values "hub-mcp" -}}
  {{- if and $hubMcp $hubMcp.enabled }}
  - matches:
    - path:
        type: PathPrefix
        value: /mcp
    timeouts:
      request: {{ .Values.gateway.timeouts.request | default "300s" }}
    backendRefs:
    - name: hub-mcp
      port: {{ ($hubMcp.service).port | default 8080 }}
  {{- end }}
  - matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: {{ .Values.gateway.timeouts.request | default "300s" }}
    backendRefs:
    - name: hub-webui
      # Must match hub-webui.service.port (values.yaml) — Express container
      # listens on 8080 (non-root).
      port: {{ (index .Values "hub-webui").service.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "elder.fullname" . }}-http-redirect
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
  - name: {{ ((.Values.gateway).parentRef).name | default "shared" }}
    namespace: {{ ((.Values.gateway).parentRef).namespace | default "gateway" }}
    sectionName: http
  hostnames:
  - {{ .Values.gateway.host | quote }}
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
{{- $hubMcpHost := .Values.gateway.mcpHost -}}
{{- $hubMcp := index .Values "hub-mcp" -}}
{{- if and $hubMcpHost $hubMcp $hubMcp.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "elder.fullname" . }}-mcp-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
  - name: {{ ((.Values.gateway).parentRef).name | default "shared" }}
    namespace: {{ ((.Values.gateway).parentRef).namespace | default "gateway" }}
    sectionName: https
  hostnames:
  - {{ $hubMcpHost | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: {{ .Values.gateway.timeouts.request | default "300s" }}
    backendRefs:
    - name: hub-mcp
      port: {{ ($hubMcp.service).port | default 8080 }}
{{- end }}
{{- end }}
