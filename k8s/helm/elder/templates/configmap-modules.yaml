# False positive on ELDER_MODULE_SECRETS: this renders .Values.modules.secrets
# (true/false), a feature-toggle flag for Elder's own "Secrets" module (a
# product feature for managing secrets), not a credential value. All values
# in this ConfigMap are booleans from .Values.modules — no actual secret
# material is ever placed here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: elder-modules
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "elder.labels" . | nindent 4 }}
data:
  {{- range $key, $enabled := .Values.modules }}
  ELDER_MODULE_{{ include "elder.upperSnakeCase" $key }}: {{ $enabled | quote }}
  {{- end }}
