{{- /* Always-rendered validation hooks (fail-fast on misconfiguration). */ -}}
{{- $_ := include "elder.secretName" . -}}
{{- include "elder.assertDbBudget" . -}}
{{- range $c := list "postgres" "redis" "hub-webui" "hub-api" "hub-mcp" "svc-worker" "svc-flows-invoker" "svc-scanner" "svc-integrations" "svc-runworker" }}
{{- $cfg := index $.Values $c }}
{{- if and $cfg $cfg.enabled }}
{{- include "elder.assertNoSecretLiterals" (list $c $cfg $) }}
{{- end }}
{{- end }}
{{- if (.Values.secrets | default dict).create }}
# DEV/ALPHA ONLY - refused by elder.secretName in any other environment.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "elder.secretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "elder.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := (.Values.secrets.devValues | default dict) }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
