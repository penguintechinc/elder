{{- $cfg := index .Values "svc-runworker" }}
{{- if and $cfg $cfg.enabled }}
{{- $execNs := $cfg.executionNamespace | default "elder-runs" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-runworker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "elder.componentLabels" (list "svc-runworker" .) | nindent 4 }}
automountServiceAccountToken: false
{{- if $cfg.createExecutionNamespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $execNs }}
  labels:
    {{- include "elder.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
{{- end }}
---
# Strictly namespaced Role inside executionNamespace — zero cluster-wide permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: svc-runworker-executor
  namespace: {{ $execNs }}
  labels:
    {{- include "elder.componentLabels" (list "svc-runworker" .) | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: svc-runworker-executor
  namespace: {{ $execNs }}
  labels:
    {{- include "elder.componentLabels" (list "svc-runworker" .) | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: svc-runworker
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: svc-runworker-executor
{{- end }}
