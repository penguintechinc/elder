          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- $csvImp := index .Values "svc-csv-importer" -}}
{{- if and $csvImp $csvImp.enabled }}
{{- $worker := index .Values "svc-worker" | default dict -}}
{{- $csvStorage := (index .Values "csvImport" | default dict).storage | default dict -}}
{{- $runsStorage := (index .Values "runs" | default dict).storage | default dict -}}
{{- $csvBucket := $csvStorage.bucket | default $runsStorage.bucket -}}
{{- $csvEndpoint := $csvStorage.endpoint | default $runsStorage.endpoint -}}
{{- $csvRegion := $csvStorage.region | default ($runsStorage.region | default "us-east-1") -}}
{{- $csvSecretName := $csvStorage.credentialsSecretName | default $runsStorage.credentialsSecretName -}}
{{- $csvAccessKey := $csvStorage.accessKeySecretKey | default ($runsStorage.accessKeySecretKey | default "access-key-id") -}}
{{- $csvSecretKey := $csvStorage.secretKeySecretKey | default ($runsStorage.secretKeySecretKey | default "secret-access-key") -}}
{{- $dbUrl := ($csvImp.env).DATABASE_URL | default (($worker.env).DATABASE_URL | default ($hubApi.env).DATABASE_URL) -}}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: svc-csv-importer
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "elder.componentLabels" (list "svc-csv-importer" .) | nindent 4 }}
spec:
  schedule: {{ $csvImp.schedule | default "*/1 * * * *" | quote }}
  concurrencyPolicy: {{ $csvImp.concurrencyPolicy | default "Forbid" }}
  startingDeadlineSeconds: {{ $csvImp.startingDeadlineSeconds | default 55 }}
  successfulJobsHistoryLimit: {{ $csvImp.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ $csvImp.failedJobsHistoryLimit | default 3 }}
  jobTemplate:
    metadata:
      labels:
        {{- include "elder.componentSelectorLabels" (list "svc-csv-importer" .) | nindent 8 }}
    spec:
      backoffLimit: {{ $csvImp.backoffLimit | default 1 }}
      activeDeadlineSeconds: {{ $csvImp.activeDeadlineSeconds | default 600 }}
      ttlSecondsAfterFinished: {{ $csvImp.ttlSecondsAfterFinished | default 600 }}
      template:
        metadata:
          labels:
            {{- include "elder.componentSelectorLabels" (list "svc-csv-importer" .) | nindent 12 }}
        spec:
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 10 }}
          {{- end }}
          serviceAccountName: {{ include "elder.serviceAccountName" . }}
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
          - name: svc-csv-importer
            image: {{ include "elder.image" (list "svc-worker" .) }}
            imagePullPolicy: {{ include "elder.imagePullPolicy" (list "svc-worker" .) }}
            command: ["python3", "-m", "apps.worker.csv_import_batch", "--once"]
            {{- if .Values.otel.enabled }}
            envFrom:
            - configMapRef:
                name: elder-otel
            {{- end }}
            env:
            {{- range $key, $value := $csvImp.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if and $dbUrl (not (hasKey ($csvImp.env | default dict) "DATABASE_URL")) }}
            - name: DATABASE_URL
              value: {{ $dbUrl | quote }}
            {{- end }}
            {{- if $csvBucket }}
            - name: CSV_IMPORT_S3_BUCKET
              value: {{ $csvBucket | quote }}
            {{- if $csvEndpoint }}
            - name: CSV_IMPORT_S3_ENDPOINT
              value: {{ $csvEndpoint | quote }}
            {{- end }}
            - name: CSV_IMPORT_S3_REGION
              value: {{ $csvRegion | quote }}
            - name: CSV_IMPORT_S3_PREFIX
              value: {{ $csvStorage.prefix | default "csv-imports" | quote }}
            - name: CSV_IMPORT_S3_PATH_STYLE
              value: {{ if hasKey $csvStorage "pathStyle" }}{{ $csvStorage.pathStyle | quote }}{{ else }}"true"{{ end }}
            {{- if $csvSecretName }}
            - name: CSV_IMPORT_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $csvSecretName }}
                  key: {{ $csvAccessKey }}
            - name: CSV_IMPORT_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $csvSecretName }}
                  key: {{ $csvSecretKey }}
            {{- end }}
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.otel.enabled }}
            - name: OTEL_SERVICE_NAME
              value: "svc-csv-importer"
            {{- end }}
            resources:
              {{- toYaml $csvImp.resources | nindent 14 }}
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            securityContext:
              {{- if $csvImp.securityContext }}
              {{- toYaml $csvImp.securityContext | nindent 14 }}
              {{- else }}
              {{- toYaml .Values.securityContext | nindent 14 }}
              {{- end }}
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: {{ ($csvImp.tmpStorage).sizeLimit | default "256Mi" }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
