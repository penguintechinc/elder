# Default values for elder
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

namespace: elder

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []

# Module toggles (Phase 0 — Layer 1 deployment-level gate; see docs/design/2026-07-07-elder-platform-merge-design.md)
# Rendered into the elder-modules ConfigMap as ELDER_MODULE_<UPPER_SNAKE> env vars,
# consumed via envFrom by the api and worker Deployments.
modules:
  # Elder-native modules — default enabled
  infrastructure: true
  ipam: true
  sbom: true
  servicesOncall: true
  issues: true
  discovery: true
  secrets: true
  webhooksAlerting: true
  accessReviews: true
  # Absorbed modules (Ruffled/IceCharts) — default disabled until ported (Phase 3+)
  helpdesk: false
  diagrams: false
  streams: false     # workflow engine (was: playbooks)
  flows: false        # CI/CD pipelines (was: cicdFlows)
  runs: false          # serverless functions (was: functions)
  documents: false     # knowledge base/documents
  pages: false          # WYSIWYG pages
  aiSearch: false
  compliance: false

# OpenTelemetry (Phase 0.5) — ungated/Free observability; all services export to SigNoz via OTLP.
# Rendered into the elder-otel ConfigMap (OTEL_EXPORTER_OTLP_ENDPOINT/PROTOCOL), consumed via
# envFrom by the api, worker, and scanner Deployments. OTEL_SERVICE_NAME is set per-component
# (elder-api/elder-worker/elder-scanner) directly in the deployment template.
otel:
  enabled: true
  endpoint: "http://signoz-otel-collector:4318"
  protocol: "http/protobuf"

# PostHog feature flags / product analytics (Phase 2 — external shared instance, NOT a subchart)
# Uncomment and configure when Layer 4 toggles are implemented.
# posthog:
#   enabled: false
#   host: "https://posthog.penguintech.cloud"
#   apiKey: ""
#   personalApiKey: ""

# PostgreSQL Database
postgres:
  enabled: true
  image:
    # pgvector required: Elder supports ONLY Postgres+pgvector (no MySQL/MariaDB/SQLite) — see design doc "AI/Search module"
    repository: pgvector/pgvector
    tag: pg17-bookworm@sha256:dd467f03ca5c5581222490e5217e48a262864ccb659be559f8491bbafdc97da0
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 5432
  env:
    POSTGRES_DB: elder
    POSTGRES_USER: elder
    POSTGRES_PASSWORD: elder_dev_password
    POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    # Required when /var/lib/postgresql/data is a PVC mount: initdb chmods
    # PGDATA to 0700, which fails with "Operation not permitted" if the mount
    # root is owned by a different UID (e.g. root:root from local-path or
    # most CSI provisioners) and the container runs non-root with
    # capabilities dropped. Pointing PGDATA at a subdirectory lets postgres
    # create + own that subdir itself instead of chmod'ing the mount root.
    PGDATA: /var/lib/postgresql/data/pgdata
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  healthcheck:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# Redis Cache
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-bookworm@sha256:24ea35ee039d7345bef2377611e3b1a615231746de4cfea74c1414575ee56167
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 6379
  env:
    REDIS_PASSWORD: elder_redis_password
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  healthcheck:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# Elder Web UI
web:
  enabled: true
  image:
    repository: elder-web
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  # Container is nginx-unprivileged (web/Dockerfile), which listens on 8080,
  # not 3000 — port/targetPort must match or the Service silently sends
  # traffic nowhere. See web/nginx.conf `listen 8080` and alpha.yml, which
  # already had this right; values.yaml/values-beta.yaml did not (release
  # audit finding).
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  buildArgs:
    VITE_API_URL: "http://localhost:4000"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  healthcheck:
    enabled: true
    # readiness path: proxied through nginx to elder-api's /healthz (see
    # web/nginx.conf `location /healthz`), so readiness correctly reflects
    # the API dependency's availability and pulls this pod out of the
    # Service when the API is down.
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
    # liveness path: the SPA's own static root — self-contained, no
    # upstream proxy_pass, so a transient API outage never triggers a
    # container restart. Lighter self-check per release audit finding #6.
    livenessPath: /
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 5
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# Elder Flask API
api:
  enabled: true
  image:
    repository: elder-api
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000
    grpcPort: 50051
  buildArgs:
    JWT_ACCESS_TOKEN_HOURS: "4"
    JWT_REFRESH_TOKEN_DAYS: "30"
  env:
    # Flask
    FLASK_ENV: production
    FLASK_APP: "apps.api.main:create_app"
    FLASK_HOST: "0.0.0.0"
    FLASK_PORT: "5000"
    SECRET_KEY: "CHANGE-IN-PRODUCTION"

    # JWT Token Expiration
    JWT_ACCESS_TOKEN_HOURS: "4"
    JWT_REFRESH_TOKEN_DAYS: "30"

    # Site URL
    SITE_URL: "http://localhost:3005"

    # Database
    DB_TYPE: postgres
    DB_HOST: elder-postgres
    DB_PORT: "5432"
    DB_NAME: elder
    DB_USER: elder
    DB_PASSWORD: elder_dev_password
    DB_POOL_SIZE: "20"

    # Redis
    REDIS_URL: "redis://:elder_redis_password@elder-redis:6379/0"

    # gRPC
    GRPC_ENABLED: "true"
    GRPC_HOST: "0.0.0.0"
    GRPC_PORT: "50051"
    GRPC_MAX_WORKERS: "10"
    GRPC_REQUIRE_LICENSE: "true"

    # License Server
    LICENSE_KEY: ""
    PRODUCT_NAME: elder
    LICENSE_SERVER_URL: "https://license.penguintech.io"

    # Auth
    SAML_ENABLED: "false"
    OAUTH2_ENABLED: "false"
    LDAP_ENABLED: "false"

    # Admin user
    ADMIN_USERNAME: admin
    ADMIN_PASSWORD: admin123
    ADMIN_EMAIL: "admin@localhost.local"

    # Guest user
    ENABLE_GUEST_LOGIN: "false"
    GUEST_USERNAME: guest
    GUEST_PASSWORD: guest

    # Logging
    LOG_LEVEL: INFO
    SYSLOG_ENABLED: "false"

    # Metrics
    METRICS_ENABLED: "true"
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  healthcheck:
    enabled: true
    # readiness: /healthz — same endpoint used for liveness today (single
    # endpoint app exposes, apps/api/main.py); kept as the readiness check
    # since it's what gates Service traffic.
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
    # liveness: same endpoint (no separate deep/self-only endpoint exists
    # yet — app-code change, out of scope for this chart-only pass) but
    # timed more leniently so a slow dependency never triggers a container
    # restart storm. Release audit finding #6.
    liveness:
      initialDelaySeconds: 45
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 5
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# Scanner Service
scanner:
  enabled: true
  image:
    repository: elder-scanner
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  buildArgs:
    SCANNER_POLL_INTERVAL: "300"
  env:
    SCANNER_POLL_INTERVAL: "300"
    ELDER_API_URL: "http://elder-api:5000"
    ELDER_API_TOKEN: ""
    SCREENSHOT_DIR: "/app/screenshots"
    LOG_LEVEL: INFO
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  screenshotStorage:
    sizeLimit: "1Gi"
  # Scanner has no HTTP server (poll-loop service) so probes are exec-based,
  # reusing the exact script its own Docker HEALTHCHECK already runs
  # (apps/scanner/healthcheck.py — verifies imports, ELDER_API_URL is set,
  # and the screenshot dir is writable). Same command for both: it's a
  # config/self-check only, not a live network call to elder-api, so there
  # is no separate "dependency-gated" variant to split it into yet.
  # Release audit finding #6 — scanner previously had no probes at all.
  healthcheck:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
    liveness:
      initialDelaySeconds: 45
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 5
  # ROOT CAPABILITY EXCEPTION (approved): masscan (apps/scanner/scanners/network.py)
  # requires CAP_NET_RAW for raw-socket SYN scanning. Process still runs as
  # non-root UID 1000 with every other capability dropped and a read-only
  # root filesystem. See apps/scanner/Dockerfile for the matching Docker-side
  # documentation of this exception.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
      add:
        - NET_RAW

# Worker Service
worker:
  enabled: true
  image:
    repository: elder-worker
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 28000
    targetPort: 28000
  env:
    # Elder API Configuration
    ELDER_API_URL: "http://elder-api:5000"
    ELDER_API_KEY: ""

    # Database (direct access for discovery jobs)
    DATABASE_URL: "postgresql://elder:elder_dev_password@elder-postgres:5432/elder"
    DATABASE_READ_URL: ""
    DB_POOL_SIZE: "10"

    # Redis (Phase-2 job-bus streams; XREADGROUP consumer id set via POD_NAME downward API)
    REDIS_URL: "redis://:elder_redis_password@elder-redis:6379/0"

    # AWS Configuration
    AWS_ENABLED: "false"
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""
    AWS_DEFAULT_REGION: "us-east-1"
    AWS_REGIONS: "us-east-1,us-west-2"
    AWS_SYNC_INTERVAL: "3600"

    # GCP Configuration
    GCP_ENABLED: "false"
    GCP_PROJECT_ID: ""
    GCP_CREDENTIALS_PATH: "/var/run/secrets/elder/gcp-credentials.json"
    GCP_SYNC_INTERVAL: "3600"

    # Google Workspace Configuration
    GOOGLE_WORKSPACE_ENABLED: "false"
    GOOGLE_WORKSPACE_CREDENTIALS_PATH: "/var/run/secrets/elder/workspace-credentials.json"
    GOOGLE_WORKSPACE_ADMIN_EMAIL: ""
    GOOGLE_WORKSPACE_CUSTOMER_ID: "my_customer"
    GOOGLE_WORKSPACE_SYNC_INTERVAL: "3600"

    # LDAP Configuration
    LDAP_ENABLED: "false"
    LDAP_SERVER: ""
    LDAP_PORT: "389"
    LDAP_USE_SSL: "false"
    LDAP_VERIFY_CERT: "true"
    LDAP_BIND_DN: ""
    LDAP_BIND_PASSWORD: ""
    LDAP_BASE_DN: ""
    LDAP_USER_FILTER: "(objectClass=person)"
    LDAP_GROUP_FILTER: "(objectClass=group)"
    LDAP_SYNC_INTERVAL: "3600"

    # Organization Mapping
    DEFAULT_ORGANIZATION_ID: ""
    CREATE_MISSING_ORGANIZATIONS: "true"

    # Sync Configuration
    SYNC_ON_STARTUP: "true"
    SYNC_BATCH_SIZE: "100"
    SYNC_MAX_RETRIES: "3"

    # Health & Monitoring
    HEALTH_CHECK_PORT: "28000"
    METRICS_ENABLED: "true"

    # Logging
    LOG_LEVEL: INFO
    LOG_FORMAT: json
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  credentialsSecret:
    name: ""  # K8s Secret name containing credential files (GCP JSON, etc.)
  healthcheck:
    enabled: true
    # readiness: /healthz (apps/worker/main.py) reports self.running plus
    # per-connector state — the closest thing this app has to a
    # dependency-gated check today.
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
    # liveness: same endpoint, timed more leniently. Release audit finding #6.
    liveness:
      initialDelaySeconds: 45
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# Flows Invoker Service — dedicated, isolated Redis Streams consumer that
# executes user-defined CI/CD stage commands inside a hardened process
# sandbox (see apps/flows_invoker/sandbox.py). No HTTP port; health is
# checked via a native Python exec probe. Deliberately network-isolated —
# see templates/networkpolicy-flows-invoker.yaml.
flows-invoker:
  enabled: true
  image:
    repository: elder-flows-invoker
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  env:
    # Database (direct access for flow execution records)
    DATABASE_URL: "postgresql://elder:elder_dev_password@elder-postgres:5432/elder"
    DATABASE_READ_URL: ""
    DB_POOL_SIZE: "5"

    # Redis (job-bus streams; XREADGROUP consumer id set via POD_NAME downward API)
    REDIS_URL: "redis://:elder_redis_password@elder-redis:6379/0"

    # Sandboxed CI workspace — writable emptyDir mount (readOnlyRootFilesystem stays true)
    FLOWS_WORKSPACE_ROOT: "/workspace"

    # Logging
    LOG_LEVEL: INFO
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  healthcheck:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # Default-deny egress except DNS, Postgres, Redis, and HTTPS (git clone/push
  # + external CI calls). Set to false only with explicit approval.
  networkPolicy:
    enabled: true

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: elder.penguintech.cloud
      paths:
        - path: /
          pathType: Prefix
          service: web
          port: 8080
        - path: /api
          pathType: Prefix
          service: api
          port: 5000
  tls:
    - secretName: elder-tls
      hosts:
        - elder.penguintech.cloud

# Cilium Gateway API (replaces ingress when enabled)
gateway:
  enabled: false
  host: elder.penguintech.cloud
  tls:
    secretName: penguintech-cloud-wildcard-tls
  timeouts:
    request: "300s"

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod Security Context
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

# Security Context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Namespace-wide default-deny CiliumNetworkPolicy — release audit finding #2.
# Cilium is the only supported CNI target (devops-kubernetes.md NetworkPolicy)
# so this is CiliumNetworkPolicy, never plain networking.k8s.io/v1. Default
# ON here/beta/gamma; alpha.yml turns it off (local MicroK8s does not run
# Cilium as CNI today, so the CRD isn't installed).
networkPolicy:
  enabled: true
  # Namespace hosting the Cilium Gateway (httproute.yaml parentRefs) that
  # needs cross-namespace ingress to web/api on their declared ports.
  gatewayNamespace: "gateway"
  # OTLP collector port (values.otel.endpoint) — same-namespace already
  # covers this; kept as an explicit, auditable allow per the release audit.
  otelCollectorPort: 4318
  # PenguinTech license validation + PostHog feature-flag/analytics egress
  # (critical-rules.md Feature Flags & License Tiers).
  licenseServerHost: "license.penguintech.io"
  posthogHost: "posthog.penguintech.cloud"

# Tetragon runtime-execution allowlist (enforced, not observe-only) —
# release audit finding #3. Default ON here/beta/gamma; alpha.yml turns it
# off (local MicroK8s does not run Tetragon today).
# flows-invoker is deliberately NOT covered: sandboxed execution of
# arbitrary user-defined CI commands is its actual product feature (see
# apps/flows_invoker/sandbox.py), not a compromise indicator — its
# isolation comes from the process sandbox + networkpolicy-flows-invoker.yaml.
tetragon:
  enabled: true

# Namespace resource + Pod Security Admission labels — release audit finding
# #4. This chart has never created its own Namespace object (it is assumed
# pre-existing, created out-of-band by CI/ops); `create: false` here so a
# bare local `helm template`/install against this default file never fights
# an unmanaged namespace. values-beta.yaml turns this on per the audit —
# see its comment for the one-time adoption step k8s-ops needs before the
# first upgrade against an already-existing, Helm-unmanaged namespace.
namespaceManagement:
  create: false
  podSecurity:
    enforce: restricted
    audit: restricted
    warn: restricted
