apiVersion: apps/v1
kind: Deployment
metadata:
  name: flows-invoker
  labels:
    app: flows-invoker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flows-invoker
  template:
    metadata:
      labels:
        app: flows-invoker
    spec:
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: flows-invoker
          image: elder-flows-invoker:alpha-latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DATABASE_URL
              value: "postgres://elder:elder_dev_password@postgres:5432/elder"
            - name: DATABASE_READ_URL
              value: ""
            - name: DB_POOL_SIZE
              value: "5"
            - name: REDIS_URL
              value: "redis://:elder_redis_password@redis:6379/0"
            - name: FLOWS_WORKSPACE_ROOT
              value: "/workspace"
            - name: LOG_LEVEL
              value: DEBUG
          # No HTTP server in this service (pure Redis Streams consumer) —
          # health is verified via a native Python exec probe instead of httpGet.
          livenessProbe:
            exec:
              command: ["python3", "apps/flows_invoker/healthcheck.py"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["python3", "apps/flows_invoker/healthcheck.py"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
