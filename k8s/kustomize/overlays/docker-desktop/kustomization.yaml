apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: elder
resources:
  - ../../base
  - ingress.yaml
# Docker Desktop Kubernetes uses Kind; images are loaded via:
#   docker save <img> | docker exec -i desktop-control-plane ctr --namespace k8s.io images import -
# Containerd stores them as docker.io/library/<name>:<tag> — match that reference exactly.
images:
  - name: elder-api:alpha-latest
    newName: docker.io/library/elder-api
    newTag: alpha-latest
  - name: elder-web:alpha-latest
    newName: docker.io/library/elder-web
    newTag: alpha-latest
  - name: elder-scanner:alpha-latest
    newName: docker.io/library/elder-scanner
    newTag: alpha-latest
  - name: elder-worker:alpha-latest
    newName: docker.io/library/elder-worker
    newTag: alpha-latest
  - name: elder-flows-invoker:alpha-latest
    newName: docker.io/library/elder-flows-invoker
    newTag: alpha-latest
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      labelSelector: "app in (api,web,scanner,worker,flows-invoker)"
labels:
  - includeSelectors: true
    pairs:
      environment: alpha
