[package]
name = "elder-int-identity"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Pure-Rust identity and directory connectors (Google Workspace, Okta, Authentik, LDAP/LDAPS) for Elder svc-integrations"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
elder-svc-common = { path = "../elder-svc-common" }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
rand = "0.8"
rsa = "0.9"
