[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = [
    "E203",   # Whitespace before ':'
    "E401",   # Multiple imports on one line
    "E402",   # Module level import not at top
    "E501",   # Line too long
    "E303",   # Too many blank lines
    "E712",   # Comparison to True with ==
    "E741",   # Ambiguous variable name
    "F401",   # Imported but unused
    "F403",   # May be undefined from star import
    "F405",   # Name may be undefined
    "F541",   # f-string without placeholder
    "F821",   # Undefined name
    "F841",   # Local variable assigned but never used
    "E722",   # Do not use bare except
]

[tool.ruff.lint.per-file-ignores]
# Star imports in pydal_models.py
"apps/api/models/*.py" = ["F821"]
# current_user from decorator context
"apps/api/api/v1/search.py" = ["F821"]
"apps/api/api/v1/sync.py" = ["F821"]
# Unused imports in __init__.py
"__init__.py" = ["F401"]
# Line too long in migrations
"alembic/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.bandit]
exclude_dirs = ["tests", "scripts", ".venv", "node_modules"]

[tool.pytest.ini_options]
# --cov-fail-under=90: org-wide 90% coverage gate (critical-rules.md Coverage).
# NOTE: CI's python-unit/python-integration jobs currently `echo ... ; exit 0`
# instead of invoking pytest (mid-PyDAL-migration stub — see ci.yml), and a
# bare `pytest tests/unit --collect-only` on this branch already errors on 14
# of the unit test modules (missing runtime deps, e.g. `pytz`, outside a
# properly provisioned venv). Both are pre-existing and out of scope here
# (apps/**-adjacent test fixes, not repo hygiene). The true floor is unmeasured
# — this threshold has no CI teeth until the skip is lifted, at which point CI
# will fail here and reveal the real number to ratchet from.
addopts = "--cov=apps --cov=shared --cov-report=term-missing --cov-fail-under=90"
