[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = [
    "E203",   # Whitespace before ':'
    "E401",   # Multiple imports on one line
    "E402",   # Module level import not at top
    "E501",   # Line too long
    "E303",   # Too many blank lines
    "E712",   # Comparison to True with ==
    "E741",   # Ambiguous variable name
    "F401",   # Imported but unused
    "F403",   # May be undefined from star import
    "F405",   # Name may be undefined
    "F541",   # f-string without placeholder
    "F821",   # Undefined name
    "F841",   # Local variable assigned but never used
    "E722",   # Do not use bare except
]

[tool.ruff.lint.per-file-ignores]
# Star imports in pydal_models.py
"apps/api/models/*.py" = ["F821"]
# current_user from decorator context
"apps/api/api/v1/search.py" = ["F821"]
"apps/api/api/v1/sync.py" = ["F821"]
# Unused imports in __init__.py
"__init__.py" = ["F401"]
# Line too long in migrations
"alembic/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.bandit]
exclude_dirs = ["tests", "scripts", ".venv", "node_modules"]

[tool.pytest.ini_options]
# ratchet to 90: org-wide target is 90% (critical-rules.md Coverage), but the
# CI unit/integration gate was dead (echo ...skipped... ; exit 0) until
# fix/ci-reenable-tests re-enabled real pytest runs (2026-09-24). Measured
# floors on a clean elder_test DB, tests/unit and tests/integration run as
# CI actually runs them (separate jobs, separate coverage of apps/+shared/):
#   tests/unit only:        44.15% (1548 passed, 17 xfailed)
#   tests/integration only: 23.67% (47 passed, 1 skipped, 8 xfailed)
#   combined:               44.28%
# 20 is a safe default floor below both measured numbers (with margin for
# incidental variance) so neither CI job breaks on day one. ci.yml passes a
# tighter --cov-fail-under override per job (40 for python-unit, matching its
# higher measured floor) which takes precedence over this default. Raise
# toward 90 as coverage improves — see gh-276/gh-275 for the stale-test debt
# suppressing coverage in tests/integration and tests/unit's sbom_schedules.
addopts = "--cov=apps --cov=shared --cov-report=term-missing --cov-fail-under=20"
