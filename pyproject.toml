[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = [
    "E203",   # Whitespace before ':'
    "E401",   # Multiple imports on one line
    "E402",   # Module level import not at top
    "E501",   # Line too long
    "E303",   # Too many blank lines
    "E712",   # Comparison to True with ==
    "E741",   # Ambiguous variable name
    "F401",   # Imported but unused
    "F403",   # May be undefined from star import
    "F405",   # Name may be undefined
    "F541",   # f-string without placeholder
    "F821",   # Undefined name
    "F841",   # Local variable assigned but never used
    "E722",   # Do not use bare except
]

[tool.ruff.lint.per-file-ignores]
# Star imports in pydal_models.py
"apps/api/models/*.py" = ["F821"]
# current_user from decorator context
"apps/api/api/v1/search.py" = ["F821"]
"apps/api/api/v1/sync.py" = ["F821"]
# Unused imports in __init__.py
"__init__.py" = ["F401"]
# Line too long in migrations
"alembic/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.bandit]
exclude_dirs = ["tests", "scripts", ".venv", "node_modules"]

[tool.pytest.ini_options]
# ratchet to 90: org-wide target is 90% (critical-rules.md Coverage), but the
# CI unit/integration gate was dead (echo ...skipped... ; exit 0) until
# fix/ci-reenable-tests re-enabled real pytest runs (2026-09-24). Measured
# floors on a clean elder_test DB, tests/unit and tests/integration run as
# CI actually runs them (separate jobs, separate coverage of apps/+shared/):
#   tests/unit only:        47.56% (1880 passed, 6 failed [pre-existing
#                           gh-275/gh-276 debt], 17 xfailed) after gh-283
#                           added ~204 real unit tests (sbom parsers,
#                           Vault/Infisical secret+key clients, AWS IAM &
#                           K8s RBAC clients, Alertmanager client, shared
#                           events). Was 44.15% before gh-283.
#   tests/integration only: 23.67% (47 passed, 1 skipped, 8 xfailed)
# Ratchet (release/v4.0.X CI run 45502797263, sha 49f50b2c): python-unit
# measured 65.83% -> ci.yml floor 64; python-integration measured 22.18% ->
# floor 21. This default is the lower of the two (21) so local partial runs
# stay meaningful; ci.yml's per-job --cov-fail-under takes precedence. Keep
# ratcheting toward 90 as coverage improves — see gh-276/gh-275 for the
# stale-test debt suppressing coverage in tests/integration and tests/unit's
# sbom_schedules.
addopts = "--cov=apps --cov=shared --cov-report=term-missing --cov-fail-under=21"
