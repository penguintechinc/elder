[package]
name = "svc-scanner"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Stateless Elder data-plane security scanner worker (discovery, banner, HTTP screenshot, SBOM, NVD sync)"

[[bin]]
name = "svc-scanner"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
cron = "0.17"
elder-svc-common = { path = "../../crates/elder-svc-common" }
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.2"
tracing = "0.1"
url = "2"
