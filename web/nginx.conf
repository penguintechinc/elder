server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream is the elder-api k8s Service (namespace = product name only,
    # per devops-kubernetes.md — never suffixed with the environment), same
    # in alpha/beta/gamma/prod. Resolved statically at nginx startup via the
    # pod's normal system resolver (kubelet-populated /etc/resolv.conf ->
    # CoreDNS), which is always correct for whichever cluster this runs in.
    #
    # Deliberately NOT the `set $api_host ...; resolver 127.0.0.11 ...;`
    # variable+resolver pattern this file used previously: 127.0.0.11 is
    # Docker Compose's embedded DNS and does not exist in Kubernetes — every
    # proxied request would have 502'd. A Service name resolves via CoreDNS
    # as soon as the Service object exists (independent of pod readiness),
    # so static resolution is safe here without needing a per-cluster
    # resolver IP.

    # API proxy
    location /api/ {
        proxy_pass http://elder-api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health endpoint proxy
    location /healthz {
        proxy_pass http://elder-api:5000/healthz;
    }

    # React Router (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
