---
# Namespace-scoped (elder only, not cluster-wide) Role for the CI/CD
# ServiceAccount that deploys Elder via `helm upgrade --install`. Write
# access to Services/Ingress is a required, least-privilege grant: Helm must
# create/update/patch (Services: also delete, for `helm uninstall` and
# resource pruning across releases) the chart's own Service/Ingress objects.
# Already excludes cluster-scoped resources (nodes, namespaces, ClusterRoles)
# and any other namespace. Suppressed as AVD-KSV-0056 in .trivyignore (repo
# root) — trivy's Kubernetes scanner does not honor inline ignore comments.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-ci-deployer
  namespace: elder
  labels:
    app.kubernetes.io/name: elder
    app.kubernetes.io/component: ci-cd
    app.kubernetes.io/managed-by: github-actions
rules:
# Deployments, ReplicaSets, StatefulSets
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]

# Services, ConfigMaps, Secrets, Pods, PVCs
- apiGroups: [""]
  resources: ["services", "configmaps", "secrets", "pods", "persistentvolumeclaims"]
  verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]

# Pod logs (for debugging)
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]

# Ingress resources (no "delete": ingress removal is not part of this role's
# normal deploy lifecycle)
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "create", "update", "patch"]

# HorizontalPodAutoscaler
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "create", "update", "patch"]

# Batch resources (Jobs, CronJobs)
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-ci-deployer
  namespace: elder
  labels:
    app.kubernetes.io/name: elder
    app.kubernetes.io/component: ci-cd
    app.kubernetes.io/managed-by: github-actions
subjects:
- kind: ServiceAccount
  name: github-ci
  namespace: elder
roleRef:
  kind: Role
  name: github-ci-deployer
  apiGroup: rbac.authorization.k8s.io
