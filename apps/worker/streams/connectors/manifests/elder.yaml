          type: any
          required: false
      outputs:
        - name: out
          type: object
      output_schema:
        - name: id
          type: number
        - name: name
          type: string
        - name: entity_type
          type: string
        - name: is_active
          type: boolean
      config_schema:
        - field: id
          type: string
          label: Entity ID
          required: true
          supports_variables: true
          placeholder: "{{$json.entity_id}}"
        - field: name
          type: string
          label: Name
          supports_variables: true
        - field: description
          type: textarea
          label: Description
          supports_variables: true
        - field: is_active
          type: boolean
          label: Active
          default: true
        - field: attributes
          type: json
          label: Attributes (JSON)
          supports_variables: true

