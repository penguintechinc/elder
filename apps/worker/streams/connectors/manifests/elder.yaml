          type: integer
          label: Organization ID
          required: true
          supports_variables: true
        - field: sub_type
          type: string
          label: Sub Type
          supports_variables: true
        - field: description
          type: textarea
          label: Description
          supports_variables: true
        - field: attributes
          type: json
          label: Attributes (JSON)
          placeholder: '{"env": "production"}'
          supports_variables: true

