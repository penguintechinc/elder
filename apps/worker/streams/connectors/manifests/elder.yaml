# Elder Platform Connector Manifest
# Live-verified against Elder API /api/v1 routes across all 16 feature modules + core.
connector:
  id: elder
  name: Elder
  description: Infrastructure CMDB, security, issues, ticketing, workflows, and knowledge platform
  icon: "Layers"
  color: "#F59E0B"
  version: "4.0.0"
  vendor: penguintech

  auth:
    methods:
      - type: jwt
        header: Authorization
        token_prefix: Bearer
        env_var: ELDER_TOKEN
      - type: api_key
        header: X-API-Key
        env_var: ELDER_API_KEY

  connection:
    base_url_env: ELDER_API_URL
    default_url: http://api:5000
    health_endpoint: /api/v1/status

  # ============================================================================
  # TRIGGERS - Webhook / event triggers emitted by Elder modules
  # ============================================================================
  triggers:
    - id: entity_created
      name: Entity Created
      description: Triggered when a new infrastructure entity is created or discovered
      icon: "Server"
      required_module: infrastructure
      subcategory: Entities
      webhook_path: /api/v1/webhooks/receive/elder-entity-created
      outputs:
        - name: out
          type: object
          description: Created entity event payload
      output_schema:
        - name: event
          type: string
          description: Event name (entity.created)
        - name: entity_id
          type: number
          description: Created entity ID
        - name: name
          type: string
          description: Entity name
        - name: entity_type
          type: string
          description: Entity type
        - name: organization_id
          type: number
          description: Organization ID
      config_schema:
        - field: entity_types
          type: multiselect
          label: Entity Types
          options: [server, database, application, service, container, network, storage, loadbalancer, cache, queue, api, microservice]
          description: Filter by entity types (empty for all)
        - field: organization_id
          type: string
          label: Organization ID Filter
          placeholder: "1"
          description: Optional organization ID filter

    - id: entity_updated
      name: Entity Updated
      description: Triggered when an infrastructure entity is modified
      icon: "Pencil"
      required_module: infrastructure
      subcategory: Entities
      webhook_path: /api/v1/webhooks/receive/elder-entity-updated
      outputs:
        - name: out
          type: object
          description: Updated entity payload
      output_schema:
        - name: event
          type: string
        - name: entity_id
          type: number
        - name: name
          type: string
        - name: entity_type
          type: string
        - name: changes
          type: object
      config_schema:
        - field: entity_types
          type: multiselect
          label: Entity Types
          options: [server, database, application, service, container, network, storage, loadbalancer, cache, queue, api, microservice]
        - field: track_fields
          type: string
          label: Track Fields
          placeholder: "name, attributes, tags"

    - id: entity_deleted
      name: Entity Deleted
      description: Triggered when an infrastructure entity is removed
      icon: "Trash2"
      required_module: infrastructure
      subcategory: Entities
      webhook_path: /api/v1/webhooks/receive/elder-entity-deleted
      outputs:
        - name: out
          type: object
          description: Deleted entity payload
      output_schema:
        - name: event
          type: string
        - name: entity_id
          type: number
        - name: name
          type: string
      config_schema:
        - field: entity_types
          type: multiselect
          label: Entity Types
          options: [server, database, application, service, container, network, storage, loadbalancer, cache, queue, api, microservice]

    - id: dependency_changed
      name: Dependency Changed
      description: Triggered when dependencies between resources are added or removed
      icon: "GitBranch"
      required_module: infrastructure
      subcategory: Dependencies
      webhook_path: /api/v1/webhooks/receive/elder-dependency-changed
      outputs:
        - name: out
          type: object
          description: Dependency change payload
      output_schema:
        - name: event
          type: string
        - name: dependency_id
          type: number
        - name: source_id
          type: number
        - name: target_id
          type: number
        - name: dependency_type
          type: string
      config_schema:
        - field: dependency_type
          type: select
          label: Dependency Type
          options: [any, runtime, buildtime, network, data, api, configuration]
          default: any

    - id: issue_created
      name: Issue Created
      description: Triggered when a new issue is opened in Elder
      icon: "AlertCircle"
      required_module: issues
      subcategory: Issues
      webhook_path: /api/v1/webhooks/receive/elder-issue-created
      outputs:
        - name: out
          type: object
          description: Created issue data
      output_schema:
        - name: event
          type: string
        - name: issue_id
          type: number
        - name: title
          type: string
        - name: priority
          type: string
        - name: issue_type
          type: string
        - name: status
          type: string
      config_schema:
        - field: priority
          type: multiselect
          label: Priority Filter
          options: [critical, urgent, high, medium, low]
        - field: issue_type
          type: multiselect
          label: Issue Type Filter
          options: [bug, feature, task, security, incident, other]

    - id: issue_status_changed
      name: Issue Status Changed
      description: Triggered when an issue transitions status
      icon: "RefreshCw"
      required_module: issues
      subcategory: Issues
      webhook_path: /api/v1/webhooks/receive/elder-issue-status
      outputs:
        - name: out
          type: object
          description: Issue status transition payload
      output_schema:
        - name: event
          type: string
        - name: issue_id
          type: number
        - name: old_status
          type: string
        - name: status
          type: string
      config_schema:
        - field: to_status
          type: multiselect
          label: Target Statuses
          options: [open, in_progress, resolved, closed, reopened]

    - id: ticket_created
      name: Helpdesk Ticket Created
      description: Triggered when a new internal helpdesk ticket is created
      icon: "Ticket"
      required_module: helpdesk
      subcategory: Helpdesk
      webhook_path: /api/v1/webhooks/receive/elder-ticket-created
      outputs:
        - name: out
          type: object
          description: Created ticket payload
      output_schema:
        - name: event
          type: string
        - name: ticket_id
          type: number
        - name: subject
          type: string
        - name: priority
          type: string
        - name: status
          type: string
      config_schema:
        - field: priority
          type: multiselect
          label: Priority Filter
          options: [critical, urgent, high, medium, low]

    - id: vuln_detected
      name: Vulnerability Detected
      description: Triggered when an SBOM scan detects a vulnerability
      icon: "ShieldAlert"
      required_module: sbom
      subcategory: Vulnerabilities
      webhook_path: /api/v1/webhooks/receive/elder-vulnerability
      outputs:
        - name: out
          type: object
          description: Vulnerability CVE details
      output_schema:
        - name: event
          type: string
        - name: vulnerability_id
          type: number
        - name: cve_id
          type: string
        - name: severity
          type: string
        - name: cvss_score
          type: number
      config_schema:
        - field: severity
          type: multiselect
          label: Severity
          options: [critical, high, medium, low]
          default: [critical, high]

    - id: discovery_completed
      name: Discovery Completed
      description: Triggered when a discovery job completes
      icon: "Radar"
      required_module: discovery
      subcategory: Discovery
      webhook_path: /api/v1/webhooks/receive/elder-discovery-completed
      outputs:
        - name: out
          type: object
          description: Discovery run summary
      output_schema:
        - name: event
          type: string
        - name: job_id
          type: number
        - name: status
          type: string
        - name: results
          type: object
      config_schema:
        - field: provider
          type: select
          label: Provider
          options: [any, aws, gcp, google_workspace, ldap, okta, authentik, vcenter, lxd, fleetdm]
          default: any

    - id: oncall_alert
      name: On-Call Alert Received
      description: Triggered when an on-call Alertmanager webhook fires
      icon: "PhoneCall"
      required_module: services_oncall
      subcategory: On-Call
      webhook_path: /api/v1/on-call/webhooks/alertmanager/webhook
      outputs:
        - name: out
          type: object
          description: Alertmanager webhook payload
      output_schema:
        - name: status
          type: string
        - name: alerts
          type: array
        - name: commonLabels
          type: object
      config_schema:
        - field: severity
          type: select
          label: Severity
          options: [any, critical, warning, info]
          default: any

    - id: flow_promo_pending
      name: Flow Promotion Pending
      description: Triggered when a CI/CD flow promotion awaits approval
      icon: "Workflow"
      required_module: flows
      subcategory: Promotions
      webhook_path: /api/v1/webhooks/receive/elder-flow-promotion
      outputs:
        - name: out
          type: object
          description: Pending promotion payload
      output_schema:
        - name: promotion_id
          type: string
        - name: flow_id
          type: string
        - name: status
          type: string
        - name: target_environment
          type: string
      config_schema:
        - field: target_environment
          type: string
          label: Target Environment
          placeholder: "production"

    - id: access_review_due
      name: Access Review Due
      description: Triggered when an enterprise access review requires decisions
      icon: "UserCheck"
      required_module: access_reviews
      required_license_feature: access-reviews
      subcategory: Access Reviews
      webhook_path: /api/v1/webhooks/receive/elder-access-review
      outputs:
        - name: out
          type: object
          description: Access review payload
      output_schema:
        - name: review_id
          type: number
        - name: group_id
          type: number
        - name: status
          type: string
        - name: due_date
          type: string
      config_schema:
        - field: status
          type: select
          label: Status
          options: [pending, in_progress, overdue]
          default: pending

    - id: user_created
      name: Identity / User Created
      description: Triggered when a new user or identity is provisioned
      icon: "UserPlus"
      required_module: core
      subcategory: Identities
      webhook_path: /api/v1/webhooks/receive/elder-user-created
      outputs:
        - name: out
          type: object
          description: Provisioned user/identity payload
      output_schema:
        - name: event
          type: string
        - name: identity_id
          type: number
        - name: username
          type: string
        - name: tenant_id
          type: number
      config_schema:
        - field: identity_type
          type: select
          label: Identity Type
          options: [any, human, service_account, bot]
          default: any

    - id: webhook_event
      name: Elder Event Webhook
      description: Generic event trigger for any outbound Elder webhook event
      icon: "Webhook"
      required_module: core
      subcategory: Events
      webhook_path: /api/v1/webhooks/receive/elder-event
      outputs:
        - name: out
          type: object
          description: Raw Elder event payload
      output_schema:
        - name: event
          type: string
        - name: payload
          type: object
        - name: timestamp
          type: string
      config_schema:
        - field: event_types
          type: string
          label: Event Types
          placeholder: "entity.created, issue.created, user.created"

  # ============================================================================
  # TRANSFORMS - Read / Search / Lookup / Analysis calls against Elder API
  # ============================================================================
  transforms:
    # --- Core ---
    - id: search_all
      name: Global Search
      description: Search across entities, organizations, and issues
      icon: "Search"
      required_module: core
      subcategory: Search
      endpoint: /api/v1/search
      method: GET
      query_params: [q, types, limit, offset]
      inputs:
        - name: in
          type: any
          required: false
      outputs:
        - name: out
          type: object
          description: Global search results
      output_schema:
        - name: results
          type: array
        - name: total
          type: number
      config_schema:
        - field: q
          type: string
          label: Query
          required: true
          supports_variables: true
          placeholder: "{{$json.name}}"
        - field: types
          type: string
          label: Resource Types
          default: "entity,organization,issue"
          placeholder: "entity,organization,issue"
        - field: limit
          type: integer
          label: Limit
          default: 50

    - id: search_entities
      name: Search Entities
      description: Search infrastructure entities with filters
      icon: "Search"
      required_module: core
      subcategory: Search
      endpoint: /api/v1/search/entities
      method: GET
      query_params: [q, entity_type, sub_type, organization_id, limit, offset]
      inputs:
        - name: in
          type: any
          required: false
      outputs:
        - name: out
          type: object
      output_schema:
        - name: items
          type: array
        - name: total
          type: number
      config_schema:
        - field: q
          type: string
          label: Query
          supports_variables: true
        - field: entity_type
          type: select
          label: Entity Type
          options: ["", server, database, application, service, container, network, storage, loadbalancer, cache, queue, api, microservice]
        - field: organization_id
          type: integer
          label: Organization ID
          supports_variables: true
        - field: limit
          type: integer
          label: Limit
          default: 50

    - id: search_graph
      name: Search Graph
      description: Query the relationship graph via search
      icon: "Network"
      required_module: core
      subcategory: Search
      endpoint: /api/v1/search/graph
      method: POST
      inputs:
        - name: in
          type: any
          required: false
      outputs:
        - name: out
          type: object
      output_schema:
        - name: nodes
          type: array
        - name: edges
          type: array
      config_schema:
        - field: entity_id
          type: integer
          label: Start Entity ID
          supports_variables: true
        - field: depth
          type: integer
          label: Max Depth
          default: 2

    - id: get_identity
      name: Lookup Identity
      description: Fetch an identity by ID
      icon: "Users"
      required_module: core
      subcategory: Identities
      endpoint: /api/v1/identities/{{id}}
      method: GET
      path_params: [id]
      inputs:
        - name: in
          type: any
          required: false
      outputs:
        - name: out
          type: object
      output_schema:
        - name: id
          type: number
        - name: username
          type: string
        - name: email
          type: string
        - name: identity_type
          type: string
        - name: is_active
          type: boolean
      config_schema:
        - field: id
          type: string
          label: Identity ID
          required: true
          supports_variables: true
          placeholder: "{{$json.identity_id}}"

    - id: resolve_ref
      name: Resolve Cross-Reference
      description: Resolve an Elder VillageID or entity cross-reference
      icon: "Link2"
      required_module: core
      subcategory: References
      endpoint: /api/v1/refs/resolve
      method: GET
      query_params: [ref]
      inputs:
        - name: in
          type: any
          required: false
      outputs:
        - name: out
          type: object
      output_schema:
        - name: ref
          type: string
        - name: resource_type
          type: string
        - name: resource_id
          type: number
      config_schema:
        - field: ref
          type: string
          label: Reference / Village ID
          required: true
          supports_variables: true

    # --- Infrastructure ---
    - id: get_entity
      name: Lookup Entity
      description: Fetch an infrastructure entity by ID
      icon: "Server"
      required_module: infrastructure
      subcategory: Entities
      endpoint: /api/v1/entities/{{id}}
      method: GET
      path_params: [id]
      inputs:
        - name: in
          type: any
          required: false
      outputs:
        - name: out
          type: object
      output_schema:
        - name: id
          type: number
        - name: village_id
          type: string
        - name: name
          type: string
        - name: entity_type
          type: string
        - name: sub_type
          type: string
        - name: organization_id
          type: number
        - name: attributes
          type: object
        - name: tags
          type: array
      config_schema:
        - field: id
          type: string
          label: Entity ID
          required: true
          supports_variables: true
          placeholder: "{{$json.entity_id}}"

    - id: list_entities
      name: List Entities
      description: List infrastructure entities with pagination and filters
      icon: "Server"
      required_module: infrastructure
      subcategory: Entities
      endpoint: /api/v1/entities
      method: GET
      query_params: [entity_type, sub_type, parent_id, organization_id, name, page, per_page]
      inputs:
        - name: in
          type: any
          required: false
      outputs:
        - name: out
          type: object
      output_schema:
        - name: items
          type: array
        - name: total
          type: number
        - name: page
          type: number
        - name: pages
          type: number
      config_schema:
        - field: entity_type
          type: string
          label: Entity Type
          supports_variables: true
        - field: sub_type
          type: string
          label: Sub Type
          supports_variables: true
        - field: organization_id
          type: integer
          label: Organization ID
          supports_variables: true
        - field: name
          type: string
          label: Name Contains
          supports_variables: true
        - field: per_page
          type: integer
          label: Per Page
          default: 50

    - id: get_entity_deps
      name: Get Entity Dependencies
      description: Fetch upstream and downstream dependencies for an entity
      icon: "GitBranch"
      required_module: infrastructure
      subcategory: Dependencies
      endpoint: /api/v1/entities/{{id}}/dependencies
      method: GET
      path_params: [id]
      inputs:
        - name: in
          type: any
          required: false
      outputs:
        - name: out
          type: object
      output_schema:
        - name: upstream
          type: array
        - name: downstream
          type: array
      config_schema:
        - field: id
          type: string
          label: Entity ID
          required: true
          supports_variables: true
          placeholder: "{{$json.id}}"

    - id: get_graph
      name: Get Dependency Graph
      description: Retrieve infrastructure dependency graph around an entity or org
      icon: "Network"
      required_module: infrastructure
      subcategory: Graph
      endpoint: /api/v1/graph
      method: GET
      query_params: [organization_id, entity_type, entity_id, depth, include_metadata]
      inputs:
        - name: in
          type: any
          required: false
      outputs:
        - name: out
          type: object
      output_schema:
        - name: nodes
          type: array
        - name: edges
          type: array
      config_schema:
        - field: entity_id
          type: integer
          label: Center Entity ID
          supports_variables: true
        - field: organization_id
          type: integer
          label: Organization ID
          supports_variables: true
        - field: depth
          type: integer
          label: Depth
          default: 2
        - field: include_metadata
          type: boolean
          label: Include Metadata
          default: false

    - id: analyze_graph
      name: Analyze Graph Impact
      description: Run impact & centrality analysis on the dependency graph
      icon: "Activity"
      required_module: infrastructure
      subcategory: Graph
      endpoint: /api/v1/graph/analyze
      method: GET
      query_params: [organization_id, entity_id]
      inputs:
        - name: in
          type: any
          required: false
      outputs:
        - name: out
          type: object
      output_schema:
        - name: single_points_of_failure
          type: array
        - name: cycles
          type: array
        - name: stats
          type: object
      config_schema:
        - field: organization_id
          type: integer
          label: Organization ID
          supports_variables: true
        - field: entity_id
          type: integer
          label: Entity ID
          supports_variables: true

    - id: get_organization
      name: Lookup Organization
      description: Fetch an organization by ID
      icon: "Building2"
      required_module: infrastructure
      subcategory: Organizations
      endpoint: /api/v1/organizations/{{id}}
      method: GET
      path_params: [id]
      inputs:
        - name: in
          type: any
          required: false
      outputs:
        - name: out
          type: object
      output_schema:
        - name: id
          type: number
        - name: name
          type: string
        - name: description
          type: string
        - name: parent_id
          type: number
      config_schema:
        - field: id
          type: string
          label: Organization ID
          required: true
          supports_variables: true

    - id: list_data_stores
      name: List Data Stores
      description: List database, cache, and storage data stores
      icon: "Database"
      required_module: infrastructure
      subcategory: Data Stores
      endpoint: /api/v1/data-stores
      method: GET
      query_params: [organization_id, store_type, page, per_page]
      inputs:
        - name: in
          type: any
          required: false
      outputs:
        - name: out
          type: object
      output_schema:
        - name: items
          type: array
        - name: total
          type: number
      config_schema:
        - field: organization_id
          type: integer
          label: Organization ID
          supports_variables: true
        - field: store_type
          type: string
          label: Store Type
        - field: per_page
          type: integer
          label: Per Page
          default: 50

    # --- IPAM ---
    - id: list_ipam_prefixes
      name: List IPAM Prefixes
      description: List CIDR IP prefixes in IPAM
      icon: "Globe"
      required_module: ipam
      subcategory: IPAM
      endpoint: /api/v1/ipam/prefixes
      method: GET
      query_params: [organization_id, status, search, page, per_page]
      inputs:
        - name: in
          type: any
          required: false
      outputs:
        - name: out
          type: object
      output_schema:
        - name: items
          type: array
        - name: total
          type: number
      config_schema:
        - field: organization_id
          type: integer
          label: Organization ID
          supports_variables: true
        - field: status
          type: select
          label: Status
          options: ["", active, reserved, deprecated]
        - field: search
          type: string
          label: Search
          supports_variables: true

    - id: list_ipam_addrs
      name: List IPAM Addresses
      description: List IP addresses in IPAM
      icon: "Globe"
      required_module: ipam
      subcategory: IPAM
      endpoint: /api/v1/ipam/addresses
      method: GET
      query_params: [prefix_id, status, search, page, per_page]
      inputs:
        - name: in
          type: any
          required: false
      outputs:
        - name: out
          type: object
      output_schema:
        - name: items
          type: array
        - name: total
          type: number
      config_schema:
        - field: prefix_id
          type: integer
          label: Prefix ID
          supports_variables: true
        - field: status
          type: select
          label: Status
          options: ["", active, reserved, deprecated, dhcp]
        - field: search
          type: string
          label: Search
          supports_variables: true

    # --- SBOM & Vulnerabilities ---
    - id: list_vulns
      name: List Vulnerabilities
      description: Query tracked CVE vulnerabilities
      icon: "ShieldAlert"
      required_module: sbom
      subcategory: Vulnerabilities
      endpoint: /api/v1/vulnerabilities
      method: GET
      query_params: [severity, status, cve_id, page, per_page]
      inputs:
        - name: in
          type: any
          required: false
      outputs:
        - name: out
          type: object
      output_schema:
        - name: items
          type: array
        - name: total
          type: number
      config_schema:
        - field: severity
          type: select
          label: Severity
          options: ["", critical, high, medium, low, unknown]
        - field: cve_id
          type: string
          label: CVE ID
          supports_variables: true
          placeholder: "CVE-2025-1234"
        - field: per_page
          type: integer
          label: Per Page
          default: 50

    - id: get_service_sbom
      name: Get Service SBOM
      description: Retrieve SBOM components for a service
      icon: "Package"
      required_module: sbom
      subcategory: SBOM
      endpoint: /api/v1/services/{{id}}/sbom
      method: GET
      path_params: [id]
      inputs:
        - name: in
          type: any
          required: false
      outputs:
        - name: out
          type: object
      output_schema:
        - name: components
          type: array
        - name: total
          type: number
      config_schema:
        - field: id
          type: string
          label: Service ID
          required: true
          supports_variables: true

    - id: list_sbom_scans
      name: List SBOM Scans
      description: List SBOM scan jobs and results
      icon: "Package"
      required_module: sbom
      subcategory: SBOM
