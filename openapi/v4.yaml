          type: string
        notes:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Notes
        organization_id:
          title: Organization Id
          type: integer
        purchasing_poc_id:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Purchasing Poc Id
        renewal_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          default: null
          title: Renewal Date
        seats:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Seats
        software_type:
          title: Software Type
          type: string
        support_contact:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Support Contact
        tags:
          anyOf:
          - items: {}
            type: array
          - type: 'null'
          default: null
          title: Tags
        tenant_id:
          title: Tenant Id
          type: integer
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Updated At
        vendor:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Vendor
        version:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Version
        village_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Village Id
      required:
      - id
      - tenant_id
      - name
      - organization_id
      - software_type
      - is_active
      - created_at
      title: SoftwareDTO
      type: object
    SyncConfigResponse:
      additionalProperties: false
      description: "A sync configuration \u2014 never includes webhook_secret or raw credentials."
      properties:
        batch_fallback_enabled:
          title: Batch Fallback Enabled
          type: boolean
        batch_size:
          title: Batch Size
          type: integer
        config_json:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Config Json
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Created At
        enabled:
          title: Enabled
          type: boolean
        has_webhook_secret:
          title: Has Webhook Secret
          type: boolean
        id:
          title: Id
          type: integer
        last_batch_sync_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Last Batch Sync At
        last_sync_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Last Sync At
        name:
          title: Name
          type: string
        platform:
          title: Platform
          type: string
        sync_interval:
          title: Sync Interval
          type: integer
        two_way_create:
          title: Two Way Create
          type: boolean
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Updated At
        webhook_enabled:
          title: Webhook Enabled
          type: boolean
      required:
      - id
      - name
      - platform
      - enabled
      - sync_interval
      - batch_fallback_enabled
      - batch_size
      - two_way_create
      - webhook_enabled
      - has_webhook_secret
      title: SyncConfigResponse
      type: object
    SyncConflictResponse:
      additionalProperties: false
      description: A sync conflict record between Elder and an external platform.
      properties:
        conflict_type:
          title: Conflict Type
          type: string
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Created At
        elder_data:
          anyOf:
          - additionalProperties: true
            type: object
          - items: {}
            type: array
          - type: 'null'
          default: null
          title: Elder Data
        external_data:
          anyOf:
          - additionalProperties: true
            type: object
          - items: {}
            type: array
          - type: 'null'
          default: null
          title: External Data
        id:
          title: Id
          type: integer
        mapping_id:
          title: Mapping Id
          type: integer
        resolution_strategy:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Resolution Strategy
        resolved:
          title: Resolved
          type: boolean
        resolved_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Resolved At
        resolved_by_id:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Resolved By Id
      required:
      - id
      - mapping_id
      - conflict_type
      - resolved
      title: SyncConflictResponse
      type: object
info:
  title: apps.api.main
  version: 0.1.0
openapi: 3.1.0
paths:
  /:
    get:
      description: ''
      operationId: get_index
      parameters: []
      responses: {}
      summary: Home page - redirect to dashboard if logged in, else login.
  /api/v1/access-reviews:
    get:
      description: "\nQuery params:\n    - status: Filter by status (scheduled/in_progress/completed/overdue)\n\
        \    - group_id: Filter by group ID\n    - limit: Results per page (default: 50)\n    - offset:\
        \ Pagination offset\n\nReturns:\n    200: List of reviews with pagination"
      operationId: get_list_reviews
      parameters: []
      responses: {}
      summary: List access reviews with filters.
    post:
      description: "\nRequest body:\n    {\n        \"group_id\": 123,\n        \"period_start\": \"2024-01-01T00:00:00Z\"\
        ,\n        \"period_end\": \"2024-03-31T23:59:59Z\",\n        \"due_date\": \"2024-04-14T23:59:59Z\"\
        ,\n        \"auto_apply\": true\n    }\n\nReturns:\n    201: Review created\n    400: Invalid\
        \ request"
      operationId: post_create_review
      parameters: []
      responses: {}
      summary: Create an ad-hoc access review (admin only).
  /api/v1/access-reviews/my-reviews:
    get:
      description: "\nQuery params:\n    - status: Filter by status\n\nReturns:\n    200: List of assigned\
        \ reviews"
      operationId: get_get_my_reviews
      parameters: []
      responses: {}
      summary: Get reviews assigned to current user.
  /api/v1/access-reviews/{review_id}:
    get:
      description: "\nReturns:\n    200: Review details\n    404: Review not found"
      operationId: get_get_review
      parameters:
      - in: path
        name: review_id
        required: true
        schema:
          type: integer
      responses: {}
      summary: Get review details with progress statistics.
  /api/v1/access-reviews/{review_id}/complete:
    post:
      description: "\nAll members must have decisions before completing.\nIf auto_apply is enabled, decisions\
        \ are applied immediately.\n\nReturns:\n    200: Review completed\n    400: Review cannot be completed\
        \ (unreviewed members)\n    404: Review not found"
      operationId: post_complete_review
      parameters:
      - in: path
        name: review_id
        required: true
        schema:
          type: integer
      responses: {}
      summary: Complete and apply review decisions.
  /api/v1/access-reviews/{review_id}/decisions:
    post:
      description: "\nRequest body:\n    {\n        \"membership_id\": 123,\n        \"decision\": \"\
        keep\" | \"remove\" | \"extend\",\n        \"justification\": \"Optional reason\",\n        \"\
        new_expiration\": \"2024-12-31T00:00:00Z\"  # Required for extend\n    }\n\nReturns:\n    200:\
        \ Decision recorded\n    400: Invalid request\n    404: Review not found"
      operationId: post_submit_decisions
      parameters:
      - in: path
        name: review_id
        required: true
        schema:
          type: integer
      responses: {}
      summary: Submit review decision for member(s).
  /api/v1/access-reviews/{review_id}/items:
    get:
      description: "\nReturns:\n    200: List of review items with identity info\n    404: Review not\
        \ found"
      operationId: get_get_review_items
      parameters:
      - in: path
        name: review_id
        required: true
        schema:
          type: integer
      responses: {}
      summary: Get all members to review in a review.
  /api/v1/api-keys:
    get:
      description: ''
      operationId: get_list_api_keys
      parameters: []
      responses: {}
      summary: List all API keys for the current user.
    post:
      description: ''
      operationId: post_create_api_key
      parameters: []
      responses: {}
      summary: Create a new API key for the current user.
  /api/v1/api-keys/{key_id}:
    delete:
      description: ''
      operationId: delete_delete_api_key
      parameters:
      - in: path
        name: key_id
        required: true
        schema:
          type: integer
      responses: {}
      summary: Delete (revoke) an API key.
  /api/v1/audit-enterprise/cleanup:
    post:
      description: "\nRequires admin permission.\n\nRequest body:\n    tenant_id: int - Tenant ID (admin\
        \ only)\n\nReturns:\n    Cleanup result with count of deleted logs"
      operationId: post_cleanup_old_logs
      parameters: []
      responses: {}
      summary: Clean up audit logs older than retention period.
  /api/v1/audit-enterprise/export:
    get:
      description: "\nQuery params:\n    tenant_id: int - Tenant ID\n    start_date: str - Export start\
        \ date\n    end_date: str - Export end date\n    format: str - Export format (json or csv)\n\n\
        Returns:\n    Exported audit logs"
      operationId: get_export_logs
      parameters: []
      responses: {}
      summary: Export audit logs for compliance archival.
  /api/v1/audit-enterprise/logs:
    get:
      description: "\nQuery params:\n    tenant_id: int - Filter by tenant\n    resource_type: str - Filter\
        \ by resource type\n    resource_id: int - Filter by resource ID\n    action: str - Filter by\
        \ action\n    category: str - Filter by category\n    portal_user_id: int - Filter by portal user\n\
        \    start_date: str - ISO date filter start\n    end_date: str - ISO date filter end\n    success:\
        \ bool - Filter by success\n    limit: int - Max results (default 100)\n    offset: int - Result\
        \ offset\n\nReturns:\n    Paginated audit logs"
      operationId: get_query_logs
      parameters: []
      responses: {}
      summary: Query audit logs with filters.
  /api/v1/audit-enterprise/reports/{report_type}:
    get:
      description: "\nArgs:\n    report_type: Report type\n        - user_access: Login/logout events\n\
        \        - permission_changes: Role and permission modifications\n        - data_access: Data\
        \ read events\n        - failed_auth: Failed authentication attempts\n        - admin_actions:\
        \ Admin operations\n\nQuery params:\n    tenant_id: int - Tenant ID (admin only)\n    start_date:\
        \ str - Report start date (ISO format)\n    end_date: str - Report end date (ISO format)\n\nReturns:\n\
        \    Compliance report with summary and events"
      operationId: get_get_compliance_report
      parameters:
      - in: path
        name: report_type
        required: true
        schema:
          type: string
      responses: {}
      summary: Generate a compliance report.
  /api/v1/audit-enterprise/retention:
    get:
      description: "\nQuery params:\n    tenant_id: int - Tenant ID (admin only)\n\nReturns:\n    Retention\
        \ policy settings"
      operationId: get_get_retention_policy
      parameters: []
      responses: {}
      summary: Get audit log retention policy for a tenant.
  /api/v1/audit/cleanup:
    post:
      description: "\nQuery params:\n    - dry_run: If true, only return count of logs to delete (default:\
        \ true)\n\nReturns:\n    200: Cleanup results"
      operationId: post_cleanup_audit_logs
      parameters: []
      responses: {}
      summary: Clean up old audit logs based on retention policies.
  /api/v1/audit/retention-policies:
    get:
      description: "\nReturns:\n    200: List of retention policies"
      operationId: get_list_retention_policies
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                description: List of audit log retention policies.
                properties:
                  count:
                    title: Count
                    type: integer
                  policies:
                    items:
                      $ref: '#/components/schemas/AuditRetentionPolicyResponse'
                    title: Policies
                    type: array
                required:
                - policies
                - count
                title: AuditRetentionPolicyListResponse
                type: object
          description: List of audit log retention policies.
      summary: List all audit retention policies.
    post:
      description: "\nRequest body:\n    {\n        \"name\": \"Standard Policy\",\n        \"retention_days\"\
        : 90,\n        \"event_types\": [\"login\", \"create\"]\n    }\n\nReturns:\n    201: Policy created\n\
        \    400: Invalid request"
      operationId: post_create_retention_policy
      parameters: []
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: false
                description: A single audit log retention policy.
                properties:
                  created_at:
                    anyOf:
                    - format: date-time
                      type: string
                    - type: 'null'
                    default: null
                    title: Created At
                  enabled:
                    title: Enabled
                    type: boolean
                  id:
                    title: Id
                    type: integer
                  resource_type:
                    title: Resource Type
                    type: string
                  retention_days:
                    title: Retention Days
                    type: integer
                  updated_at:
                    anyOf:
                    - format: date-time
                      type: string
                    - type: 'null'
                    default: null
                    title: Updated At
                required:
                - id
                - resource_type
                - retention_days
                - enabled
                title: AuditRetentionPolicyResponse
                type: object
          description: A single audit log retention policy.
      summary: Create audit retention policy.
  /api/v1/audit/retention-policies/{policy_id}:
    delete:
      description: "\nReturns:\n    200: Policy deleted\n    404: Policy not found"
      operationId: delete_delete_retention_policy
      parameters:
      - in: path
        name: policy_id
        required: true
        schema:
          type: integer
      responses: {}
      summary: Delete retention policy.
    get:
      description: "\nReturns:\n    200: Policy details\n    404: Policy not found"
      operationId: get_get_retention_policy
      parameters:
      - in: path
        name: policy_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                description: A single audit log retention policy.
                properties:
                  created_at:
                    anyOf:
                    - format: date-time
                      type: string
                    - type: 'null'
                    default: null
                    title: Created At
                  enabled:
                    title: Enabled
                    type: boolean
                  id:
                    title: Id
                    type: integer
                  resource_type:
                    title: Resource Type
                    type: string
                  retention_days:
                    title: Retention Days
                    type: integer
                  updated_at:
                    anyOf:
                    - format: date-time
                      type: string
                    - type: 'null'
                    default: null
                    title: Updated At
                required:
                - id
                - resource_type
                - retention_days
                - enabled
                title: AuditRetentionPolicyResponse
                type: object
          description: A single audit log retention policy.
      summary: Get retention policy details.
    put:
      description: "\nRequest body:\n    {\n        \"retention_days\": 180,\n        \"is_active\": false\n\
        \    }\n\nReturns:\n    200: Policy updated\n    404: Policy not found"
      operationId: put_update_retention_policy
      parameters:
      - in: path
        name: policy_id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                description: A single audit log retention policy.
                properties:
                  created_at:
                    anyOf:
                    - format: date-time
                      type: string
                    - type: 'null'
                    default: null
                    title: Created At
                  enabled:
                    title: Enabled
                    type: boolean
                  id:
                    title: Id
                    type: integer
                  resource_type:
                    title: Resource Type
                    type: string
                  retention_days:
                    title: Retention Days
                    type: integer
                  updated_at:
                    anyOf:
                    - format: date-time
                      type: string
                    - type: 'null'
                    default: null
                    title: Updated At
                required:
                - id
                - resource_type
                - retention_days
                - enabled
                title: AuditRetentionPolicyResponse
                type: object
          description: A single audit log retention policy.
      summary: Update retention policy.
  /api/v1/auth/captcha-challenge:
    get:
      description: ''
      operationId: get_captcha_challenge
      parameters: []
      responses: {}
      summary: Generate ALTCHA proof-of-work challenge.
  /api/v1/auth/change-password:
    post:
      description: "\nRequest Body:\n    {\n        \"current_password\": \"string\",\n        \"new_password\"\
        : \"string\"\n    }\n\nReturns:\n    200: Password changed successfully\n    400: Validation error\n\
        \    401: Current password incorrect"
      operationId: post_change_password
      parameters: []
      responses: {}
      summary: Change current user's password.
  /api/v1/auth/guest-enabled:
    get:
      description: "\nReturns:\n    200: Guest login status\n    {\n        \"enabled\": boolean,\n  \
        \      \"username\": \"string\" (only if enabled)\n    }"
      operationId: get_guest_enabled
      parameters: []
      responses: {}
      summary: Check if guest login is enabled.
  /api/v1/auth/login:
    post:
      description: "\nRequest Body:\n    {\n        \"username\": \"email@example.com\" (must be valid\
        \ email),\n        \"password\": \"string\"\n    }\n\nReturns:\n    200: Login successful with\
        \ access and refresh tokens\n    401: Invalid credentials\n    422: Invalid email format"
      operationId: post_login
      parameters: []
      responses: {}
      summary: Login with email and password (portal authentication).
  /api/v1/auth/logout:
    post:
      description: "\nReturns:\n    200: Logout successful"
      operationId: post_logout
      parameters: []
      responses: {}
      summary: Logout current user.
  /api/v1/auth/me:
    get:
      description: "\nReturns:\n    200: User information"
      operationId: get_get_current_user_info
      parameters: []
      responses: {}
      summary: Get current authenticated user information.
  /api/v1/auth/refresh:
    post:
      description: "\nRequest Body:\n    {\n        \"refresh_token\": \"string\"\n    }\n\nReturns:\n\
        \    200: New access token\n    401: Invalid refresh token"
      operationId: post_refresh_token_endpoint
      parameters: []
      responses: {}
      summary: Refresh access token using refresh token.
  /api/v1/auth/register:
    post:
      description: "\nRequest Body:\n    {\n        \"username\": \"email@example.com\" (must be valid\
        \ email for portal auth),\n        \"password\": \"string\" (minimum 8 characters),\n        \"\
        email\": \"email@example.com\" (must match username),\n        \"full_name\": \"string\" (optional)\n\
        \    }\n\nReturns:\n    201: User created successfully\n    400: Validation error or username\
        \ already exists\n    422: Invalid email format"
      operationId: post_register
      parameters: []
      responses: {}
      summary: Register a new user (local authentication).
  /api/v1/backup:
    get:
      description: "\nQuery params:\n    - job_id: Filter by backup job\n    - limit: Number of backups\
        \ (default: 50)\n\nReturns:\n    200: List of backups"
      operationId: get_list_backups
      parameters: []
      responses: {}
      summary: List all backups.
  /api/v1/backup/export:
    post:
      description: "\nRequest body:\n    {\n        \"format\": \"json\",\n        \"resource_types\"\
        : [\"entity\", \"organization\", \"issue\"],\n        \"filters\": {...}\n    }\n\nReturns:\n\
        \    202: Export started\n    400: Invalid request"
      operationId: post_export_data
      parameters: []
      responses: {}
      summary: Export data to various formats.
  /api/v1/backup/export/{filename}/download:
    get:
      description: "\nReturns:\n    200: Export file\n    404: Export not found"
      operationId: get_download_export
      parameters:
      - in: path
        name: filename
        required: true
        schema:
          type: string
      responses: {}
      summary: Download exported data.
  /api/v1/backup/import:
    post:
      description: "\nRequest: multipart/form-data with file upload\n    - file: Data file (json, json.gz)\n\
        \    - dry_run: Test import without committing (optional, default: false)\n\nReturns:\n    202:\
        \ Import started\n    400: Invalid file or format"
      operationId: post_import_data
      parameters: []
      responses: {}
      summary: Import data from file.
  /api/v1/backup/jobs:
    get:
      description: "\nQuery params:\n    - enabled: Filter by enabled status\n\nReturns:\n    200: List\
        \ of backup jobs"
      operationId: get_list_backup_jobs
      parameters: []
      responses: {}
      summary: List all backup jobs.
    post:
      description: "\nRequest body:\n    {\n        \"name\": \"Daily Full Backup\",\n        \"schedule\"\
        : \"0 2 * * *\",\n        \"retention_days\": 30,\n        \"enabled\": true,\n        \"description\"\
        : \"Daily backup at 2 AM\",\n        \"include_tables\": [\"entities\", \"organizations\"],\n\
        \        \"exclude_tables\": [\"audit_logs\"]\n    }\n\nReturns:\n    201: Job created\n    400:\
        \ Invalid request"
      operationId: post_create_backup_job
      parameters: []
      responses: {}
      summary: Create a new backup job.
  /api/v1/backup/jobs/{job_id}:
    delete:
      description: "\nReturns:\n    200: Job deleted\n    404: Job not found"
      operationId: delete_delete_backup_job
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          type: integer
      responses: {}
      summary: Delete backup job.
    get:
      description: "\nReturns:\n    200: Job details\n    404: Job not found"
      operationId: get_get_backup_job
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          type: integer
      responses: {}
      summary: Get backup job details.
    put:
      description: "\nRequest body (all optional):\n    {\n        \"name\": \"Updated name\",\n     \
        \   \"schedule\": \"0 3 * * *\",\n        \"retention_days\": 60,\n        \"enabled\": false,\n\
        \        \"description\": \"Updated description\"\n    }\n\nReturns:\n    200: Job updated\n \
        \   404: Job not found"
      operationId: put_update_backup_job
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          type: integer
      responses: {}
      summary: Update backup job configuration.
  /api/v1/backup/jobs/{job_id}/run:
    post:
      description: "\nReturns:\n    202: Backup started\n    404: Job not found"
      operationId: post_run_backup_job
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          type: integer
      responses: {}
      summary: Manually trigger a backup job.
  /api/v1/backup/stats:
    get:
      description: "\nReturns:\n    200: Storage statistics"
      operationId: get_get_backup_stats
      parameters: []
      responses: {}
      summary: Get backup and storage statistics.
  /api/v1/backup/{backup_id}:
    delete:
      description: "\nReturns:\n    200: Backup deleted\n    404: Backup not found"
      operationId: delete_delete_backup
      parameters:
      - in: path
        name: backup_id
        required: true
        schema:
          type: integer
      responses: {}
      summary: Delete backup file.
    get:
      description: "\nReturns:\n    200: Backup details\n    404: Backup not found"
      operationId: get_get_backup
      parameters:
      - in: path
        name: backup_id
        required: true
        schema:
          type: integer
      responses: {}
      summary: Get backup details.
  /api/v1/backup/{backup_id}/download:
    get:
      description: "\nReturns:\n    200: Backup file\n    404: Backup not found"
      operationId: get_download_backup
      parameters:
      - in: path
        name: backup_id
        required: true
        schema:
          type: integer
      responses: {}
      summary: Download backup file.
  /api/v1/backup/{backup_id}/restore:
    post:
      description: "\nRequest body:\n    {\n        \"dry_run\": false,\n        \"restore_options\":\
        \ {\n            \"tables\": [\"entities\", \"organizations\"],\n            \"clear_existing\"\
        : false,\n            \"regenerate_ids\": true\n        }\n    }\n\nReturns:\n    202: Restore\
