  /api/v1/on-call/webhooks/alertmanager/webhook:
    post:
      description: "\nThis webhook is called by AlertManager for each alert firing. It:\n1. Parses alert\
        \ details from AlertManager format\n2. Finds matching on-call rotations\n3. Gets current on-call\
        \ person\n4. Sends notifications to configured channels\n5. Records notification in on_call_notifications\
        \ table\n\nRequest Body (AlertManager format):\n    - alerts: Array of alert objects\n    - groupLabels:\
        \ Alert group labels (service, team, etc.)\n    - commonLabels: Common labels for all alerts\n\
        \    - commonAnnotations: Common annotations\n\nReturns:\n    202: Accepted for processing\n \
        \   400: Invalid request\n\nExample:\n    POST /api/v1/on-call/alertmanager/webhook\n    {\n \
        \       \"alerts\": [\n            {\n                \"status\": \"firing\",\n              \
        \  \"labels\": {\n                    \"alertname\": \"HighErrorRate\",\n                    \"\
        service\": \"api\",\n                    \"severity\": \"critical\"\n                },\n    \
        \            \"annotations\": {\n                    \"summary\": \"High error rate detected\"\
        \n                }\n            }\n        ],\n        \"groupLabels\": {\n            \"service\"\
        : \"api\"\n        },\n        \"commonLabels\": {\n            \"severity\": \"critical\"\n \
        \       }\n    }"
      operationId: post_handle_alertmanager_webhook
      parameters: []
      responses: {}
      summary: Receive Prometheus AlertManager alerts and notify on-call rotations.
