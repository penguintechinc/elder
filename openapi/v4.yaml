        \ Unit not found"
      operationId: put_update_organization
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Immutable Organization Unit (OU) data transfer object.
                properties:
                  cloud_account_id:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Cloud Account Id
                  cloud_provider:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Cloud Provider
                  created_at:
                    format: date-time
                    title: Created At
                    type: string
                  description:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Description
                  display_name:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Display Name
                  id:
                    title: Id
                    type: integer
                  is_active:
                    default: true
                    title: Is Active
                    type: boolean
                  metadata:
                    anyOf:
                    - additionalProperties: true
                      type: object
                    - type: 'null'
                    default: null
                    title: Metadata
                  name:
                    title: Name
                    type: string
                  owner_group_id:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    title: Owner Group Id
                  owner_identity_id:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    title: Owner Identity Id
                  parent_id:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    title: Parent Id
                  region:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Region
                  settings:
                    anyOf:
                    - additionalProperties: true
                      type: object
                    - type: 'null'
                    default: null
                    title: Settings
                  slug:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Slug
                  tags:
                    anyOf:
                    - items: {}
                      type: array
                    - type: 'null'
                    default: null
                    title: Tags
                  tenant_id:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    default: null
                    title: Tenant Id
                  type:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Type
                  updated_at:
                    format: date-time
                    title: Updated At
                    type: string
                required:
                - id
                - name
                - description
                - type
                - parent_id
                - owner_identity_id
                - owner_group_id
                - created_at
                - updated_at
                title: OrganizationDTO
                type: object
          description: Immutable Organization Unit (OU) data transfer object.
      summary: Update an Organization Unit (OU).
  /api/v1/organizations/{id}/children:
    get:
      description: "\nPath Parameters:\n    - id: Organization ID\n\nQuery Parameters:\n    - recursive:\
        \ Include all descendants (default: false)\n\nReturns:\n    200: List of child organizations\n\
        \    404: Organization not found"
      operationId: get_get_organization_children
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OrganizationDTO'
                type: array
          description: 'Built-in mutable sequence.


            If no argument is given, the constructor creates a new empty list.

            The argument must be an iterable if specified.'
      summary: Get all child organizations scoped to the caller's tenant.
  /api/v1/organizations/{id}/graph:
    get:
      description: "\nPath Parameters:\n    - id: Organization ID\n\nQuery Parameters:\n    - depth: How\
        \ many hops away to include (default: 3, max: 10)\n\nReturns:\n    200: Graph data with nodes\
        \ and edges\n    403: Missing tenant claim in token\n    404: Organization not found, or found\
        \ but outside caller's tenant"
      operationId: get_get_organization_graph
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses: {}
      summary: Get relationship graph for an organization and its nearby entities.
  /api/v1/organizations/{org_id}/tree-stats:
    get:
      description: "\nThis endpoint recursively traverses the organization tree starting from the\nspecified\
        \ organization and aggregates counts for all resources across the\nentire tree.\n\nPath Parameters:\n\
        \    - org_id: Root organization ID\n\nReturns:\n    200: Aggregated statistics\n    {\n     \
        \   \"organization_id\": 1,\n        \"organization_name\": \"Engineering\",\n        \"total_sub_organizations\"\
        : 15,\n        \"total_entities\": 234,\n        \"total_issues\": 42,\n        \"total_projects\"\
        : 8,\n        \"total_milestones\": 23,\n        \"active_issues\": 28,\n        \"active_projects\"\
        : 5,\n        \"organizations\": [1, 2, 3, ...],  // All org IDs in tree\n        \"breakdown\"\
        : {\n            \"by_entity_type\": {\"compute\": 50, \"database\": 30, ...},\n            \"\
        by_issue_priority\": {\"high\": 10, \"medium\": 20, ...},\n            \"by_project_status\":\
        \ {\"active\": 5, \"planning\": 2, ...}\n        }\n    }\n    404: Organization not found"
      operationId: get_get_organization_tree_stats
      parameters:
      - in: path
        name: org_id
        required: true
        schema:
          type: integer
      responses: {}
      summary: Get recursive statistics for an organization and all its descendants.
  /api/v1/pages:
    get:
      description: "\nQuery Parameters:\n    - page: Page number (default: 1)\n    - per_page: Items per\
        \ page (default: 20, max: 100)\n    - status: Filter by status (draft, published, archived)\n\
        \    - visibility: Filter by visibility (public, authenticated, roles, users)\n\nReturns:\n  \
        \  200: Paginated list of pages (visibility-filtered)"
      operationId: get_list_pages
      parameters: []
      responses: {}
      summary: List pages with optional filtering, visibility ACL, and pagination.
    post:
      description: "\nRequest body:\n    {\n        \"title\": \"string (required)\",\n        \"body_html\"\
        : \"string (required, will be sanitized)\",\n        \"status\": \"draft|published (default: draft)\"\
        ,\n        \"visibility\": \"public|authenticated|roles|users (default: authenticated)\",\n  \
        \      \"visibility_roles\": [\"role1\", \"role2\"] (optional, for 'roles' visibility),\n    \
        \    \"visibility_users\": [123, 456] (optional, for 'users' visibility),\n        \"is_public\"\
        : boolean (default: false),\n    }\n\nReturns:\n    201: Created page\n    400: Validation error\n\
        \    409: Slug conflict (per-tenant)"
      operationId: post_create_page
      parameters: []
      responses: {}
      summary: Create a new page.
  /api/v1/pages/{collection_id}:
    delete:
      description: "\nReturns:\n    204: No content\n    404: Page or collection not found"
      operationId: delete_detach_collection
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      - in: path
        name: collection_id
        required: true
        schema:
          type: integer
      responses: {}
      summary: Detach a document collection from a page.
    post:
      description: "\nReturns:\n    200: Success\n    404: Page or collection not found"
      operationId: post_attach_collection
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      - in: path
        name: collection_id
        required: true
        schema:
          type: integer
      responses: {}
      summary: Attach a document collection to a page.
  /api/v1/pages/{slug}:
    delete:
      description: "\nReturns:\n    204: No content\n    404: Not found"
      operationId: delete_delete_page
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      responses: {}
      summary: Delete page by slug (admin only).
    get:
      description: "\nReturns:\n    200: Page details\n    403: Visibility denied\n    404: Not found"
      operationId: get_get_page_by_slug
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      responses: {}
      summary: Get page by slug with visibility ACL.
    put:
      description: "\nRequest body:\n    {\n        \"title\": \"string (optional)\",\n        \"body_html\"\
        : \"string (optional, will be sanitized)\",\n        \"status\": \"string (optional)\",\n    \
        \    \"visibility\": \"string (optional)\",\n        \"is_public\": \"boolean (optional)\",\n\
        \    }\n\nReturns:\n    200: Updated page\n    404: Not found"
      operationId: put_update_page
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      responses: {}
      summary: Update page by slug.
  /api/v1/pages/{slug}/backlinks:
    get:
      description: "\nReturns:\n    200: List of backlinks\n    404: Page not found"
      operationId: get_get_backlinks
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      responses: {}
      summary: Get all pages that reference this page via wiki-links.
  /api/v1/portal-auth/login:
    post:
      description: "\nRequest body:\n    tenant: str - Tenant slug (or use tenant_id)\n    email: str\
        \ - Email address (validated format)\n    password: str - Password\n\nReturns:\n    Tokens on\
        \ success, or MFA challenge\n    422: Invalid email format or validation error"
      operationId: post_login
      parameters: []
      responses: {}
      summary: Authenticate a portal user.
  /api/v1/portal-auth/logout:
    post:
      description: '

        Portal-auth JWTs are stateless -- there''s no server-side session to

        invalidate -- so this is a cookie-clear operation only, mirroring

        apps/api/web''s SSR logout (apps.api.auth.web_auth.clear_session_cookie).

        Deliberately unauthenticated: it must still succeed (and clear a stale

        refresh cookie) even if the caller''s access token already expired.'
      operationId: post_logout
      parameters: []
      responses: {}
      summary: Clear the SPA's HttpOnly auth cookies.
  /api/v1/portal-auth/me:
    get:
      description: "\nReturns:\n    User info and permissions"
      operationId: get_get_current_user
      parameters: []
      responses: {}
      summary: Get current authenticated portal user info.
    patch:
      description: "\nAllowed fields: full_name, organization_id\nEmail cannot be changed via this endpoint.\n\
        \nReturns:\n    Updated user info"
      operationId: patch_update_current_user
      parameters: []
      responses: {}
      summary: Update current authenticated portal user info.
  /api/v1/portal-auth/mfa/disable:
    post:
      description: "\nReturns:\n    Success status"
      operationId: post_disable_mfa
      parameters: []
      responses: {}
      summary: Disable MFA for the authenticated user.
  /api/v1/portal-auth/mfa/enable:
    post:
      description: "\nReturns:\n    MFA setup info (secret, provisioning URI, backup codes)"
      operationId: post_enable_mfa
      parameters: []
      responses: {}
      summary: Enable MFA for the authenticated user.
  /api/v1/portal-auth/mfa/verify:
    post:
      description: "\nRequest body:\n    user_id: int - User ID from login response\n    totp_code: str\
        \ - 6-digit TOTP code\n\nReturns:\n    Tokens on success"
      operationId: post_verify_mfa
      parameters: []
      responses: {}
      summary: Verify MFA code after initial authentication.
  /api/v1/portal-auth/org-assignments:
    post:
      description: "\nRequires tenant admin or global admin.\n\nRequest body:\n    portal_user_id: int\
        \ - User to assign\n    organization_id: int - Organization\n    role: str - Role (admin/maintainer/reader)\n\
        \nReturns:\n    Assignment result"
      operationId: post_assign_org_role
      parameters: []
      responses: {}
      summary: Assign a portal user to an organization with a role.
  /api/v1/portal-auth/password/change:
    post:
      description: "\nRequest body:\n    current_password: str - Current password\n    new_password: str\
        \ - New password\n\nReturns:\n    Success status"
      operationId: post_change_password
      parameters: []
      responses: {}
      summary: Change password for the authenticated user.
  /api/v1/portal-auth/password/reset:
    post:
      description: "\nRequest body:\n    tenant_id: int - Tenant context\n    email: str - Email address\n\
        \nReturns:\n    Success message (token in development only)"
      operationId: post_reset_password
      parameters: []
      responses: {}
      summary: Initiate password reset.
  /api/v1/portal-auth/refresh:
    post:
      description: "\nRequest body:\n    refresh_token: str - Refresh token (non-browser callers). Browser\n\
        \        callers omit this -- the refresh token is read from the HttpOnly\n        `elder_refresh_token`\
        \ cookie instead (gh security audit, High:\n        tokens no longer live in localStorage for\
        \ the SPA to resend).\n\nReturns:\n    New access token (also re-set as HttpOnly cookies for the\
        \ browser)"
      operationId: post_refresh_token
      parameters: []
      responses: {}
      summary: Refresh access token using refresh token.
  /api/v1/portal-auth/register:
    post:
      description: "\nRequest body:\n    tenant: str - Tenant slug (or use tenant_id)\n    email: str\
        \ - Email address (validated format)\n    password: str - Password (minimum 8 characters)\n  \
        \  full_name: str (optional) - Full name\n\nReturns:\n    User info and tokens on success\n  \
        \  422: Invalid email format or validation error"
      operationId: post_register
      parameters: []
      responses: {}
      summary: Register a new portal user.
  /api/v1/privacy-admin/bulk-erase:
    post:
      description: "\nEvery id in `identity_ids` is re-verified against the admin's own tenant\nbefore\
        \ erasure (apps/api/services/privacy/service.py) -- an id belonging\nto another tenant comes back\
        \ as a per-item \"not found\", never erased.\n\nRequest body:\n    {\"identity_ids\": [1, 2, 3]}\n\
        \nReturns:\n    200: {\"results\": [{\"identity_id\": ..., \"anonymized\": bool, ...}, ...]}\n\
        \    400: missing/invalid identity_ids\n    403: caller's deployment tier is below Enterprise,\
        \ or no tenant claim"
      operationId: post_bulk_erase
      parameters: []
      responses: {}
      summary: Bulk right-to-erasure across many identities in one call (Enterprise).
  /api/v1/privacy-admin/requests:
    get:
      description: "\nReturns:\n    200: {\"requests\": [...], \"count\": N}\n    403: caller's deployment\
        \ tier is below Enterprise, or no tenant claim"
      operationId: get_list_dsar_requests
      parameters: []
      responses: {}
      summary: List DSAR self-service + bulk activity for the admin's own tenant (Enterprise).
  /api/v1/privacy/me/consent:
    post:
      description: "\nRequest body:\n    {\"do_not_sell_share\": true|false}\n\nReturns:\n    200: {\"\
        identity_id\": ..., \"do_not_sell_share\": ...}\n    400: missing/invalid body\n    404: feature\
        \ disabled (flag off) or identity not found"
      operationId: post_set_my_consent
      parameters: []
      responses: {}
      summary: CCPA/CPRA "Do Not Sell or Share" opt-out + consent withdrawal (per-user flag).
  /api/v1/privacy/me/erase:
    post:
      description: "\nBlocked (409) while the caller's tenant is under an active legal hold --\nsee docs/compliance/data-retention-policy.md\
        \ Legal Holds.\n\nReturns:\n    200: {\"identity_id\": ..., \"anonymized\": true}\n    404: feature\
        \ disabled (flag off) or identity not found\n    409: tenant is under an active legal hold"
      operationId: post_erase_my_data
      parameters: []
      responses: {}
      summary: 'GDPR Art. 17 right-to-erasure: anonymize the caller''s own PII.'
  /api/v1/privacy/me/export:
    get:
      description: "\nReturns:\n    200: {\"identity\": {...}, \"roles\": [...], \"group_memberships\"\
        : [...]}\n    404: feature disabled (flag off) or identity not found"
      operationId: get_export_my_data
      parameters: []
      responses: {}
      summary: 'GDPR Art. 15 / CCPA right-to-know: export the caller''s own data as JSON.'
  /api/v1/profile/me:
    get:
      description: "\nReturns:\n    200: User profile data\n    {\n        \"id\": 1,\n        \"username\"\
        : \"john.doe\",\n        \"email\": \"john@example.com\",\n        \"full_name\": \"John Doe\"\
        ,\n        \"organization_id\": 5,\n        \"organization_name\": \"Engineering\",\n        \"\
        is_superuser\": false,\n        \"is_active\": true,\n        \"created_at\": \"2025-01-01T00:00:00Z\"\
        \n    }\n    404: User not found"
      operationId: get_get_profile
      parameters: []
      responses: {}
      summary: Get current user's profile information.
    patch:
      description: "\nRequest Body:\n    {\n        \"full_name\": \"string\" (optional),\n        \"\
        email\": \"string\" (optional),\n        \"organization_id\": number (optional)\n    }\n\nReturns:\n\
        \    200: Profile updated successfully with updated profile data\n    400: Validation error\n\
        \    404: User or organization not found"
      operationId: patch_update_profile
      parameters: []
      responses: {}
      summary: Update current user's profile information.
  /api/v1/projects:
    get:
      description: "\nQuery Parameters:\n    - organization_id: Filter by organization\n    - status:\
        \ Filter by status (active/completed/archived)\n    - page: Page number (default: 1)\n    - per_page:\
        \ Items per page (default: 50)\n    - search: Search in name and description\n\nReturns:\n   \
        \ 200: List of projects with pagination\n    400: Invalid parameters\n\nExample:\n    GET /api/v1/projects?organization_id=1&status=active"
      operationId: get_list_projects
      parameters: []
      responses: {}
      summary: List projects with optional filtering.
    post:
      description: "\nRequires viewer role on the resource.\n\nRequest Body:\n    {\n        \"name\"\
        : \"Q1 2024 Infrastructure Upgrade\",\n        \"description\": \"Upgrade all servers to latest\
        \ LTS versions\",\n        \"status\": \"active\",\n        \"organization_id\": 1,\n        \"\
        start_date\": \"2024-01-01\",\n        \"end_date\": \"2024-03-31\"\n    }\n\nReturns:\n    201:\
        \ Project created\n    400: Invalid request\n    403: Insufficient permissions\n\nExample:\n \
        \   POST /api/v1/projects"
      operationId: post_create_project
      parameters: []
      responses: {}
      summary: Create a new project.
  /api/v1/projects/{id}:
