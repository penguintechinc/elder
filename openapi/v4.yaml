      description: "\nRequires maintainer role.\n\nPath Parameters:\n    - id: Project ID\n\nReturns:\n\
        \    204: Project deleted\n    403: Insufficient permissions\n    404: Project not found\n\nExample:\n\
        \    DELETE /api/v1/projects/1"
      operationId: delete_delete_project
      parameters:
      - in: path
        name: id
        required: true
