        \    {\n        \"name\": \"Updated Project Name\",\n        \"status\": \"completed\"\n    }\n\
        \nReturns:\n    200: Project updated\n    400: Invalid request\n    403: Insufficient permissions\n\
        \    404: Project not found\n\nExample:\n    PUT /api/v1/projects/1"
      operationId: put_update_project
