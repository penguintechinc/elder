  /api/v1/resource-roles/identities/{id}/resource-roles:
    get:
      description: "\nPath Parameters:\n    - id: Identity ID\n\nReturns:\n    200: List of resource roles\
        \ for this identity\n    403: License required\n    404: Identity not found\n\nExample:\n    GET\
        \ /api/v1/resource-roles/identities/5/resource-roles\n    {\n        \"items\": [\n          \
        \  {\n                \"id\": 1,\n                \"resource_type\": \"entity\",\n           \
        \     \"resource_id\": 42,\n                \"role\": \"maintainer\"\n            },\n       \
        \     {\n                \"id\": 2,\n                \"resource_type\": \"organization\",\n  \
        \              \"resource_id\": 1,\n                \"role\": \"operator\"\n            }\n  \
        \      ],\n        \"total\": 2\n    }"
      operationId: get_list_identity_resource_roles
      parameters:
      - in: path
        name: id
        required: true
