        \ {\n        \"identity_id\": 5,\n        \"resource_type\": \"entity\",\n        \"resource_id\"\
        : 42,\n        \"role\": \"operator\"\n    }\n\n    Response:\n    {\n        \"id\": 1,\n   \
        \     \"identity_id\": 5,\n        \"resource_type\": \"entity\",\n        \"resource_id\": 42,\n\
        \        \"role\": \"operator\",\n        \"created_at\": \"2024-10-23T10:00:00Z\"\n    }"
      operationId: post_create_resource_role
      parameters: []
      responses: {}
