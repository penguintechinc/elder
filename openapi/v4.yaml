      operationId: get_get_dashboard
      parameters: []
      responses: {}
      summary: Get vulnerability dashboard summary statistics.
  /api/v1/vulnerabilities/nvd-sync:
    post:
      description: "\nThis endpoint triggers a background sync of CVE data from NVD (NIST).\nOnly vulnerabilities\
        \ that haven't been synced in the last 24 hours\nwill be processed. Rate limits are respected\
        \ (6 req/min without API key,\n50 req/30s with API key).\n\nRequires maintainer role.\n\nRequest\
        \ Body (optional):\n    - max_vulns: Maximum vulnerabilities to sync (default: 500)\n    - force_refresh:\
        \ Force refresh all CVEs (default: false)\n\nReturns:\n    202: Sync started with statistics\n\
        \    403: Insufficient permissions\n\nExample:\n    POST /api/v1/vulnerabilities/nvd-sync\n  \
        \  {\"max_vulns\": 100}"
      operationId: post_trigger_nvd_sync
      parameters: []
      responses: {}
      summary: Trigger NVD sync to enrich vulnerability CVSS data.
  /api/v1/vulnerabilities/nvd-sync/status:
    get:
      description: "\nReturns:\n    200: Sync status with counts\n\nExample:\n    GET /api/v1/vulnerabilities/nvd-sync/status"
      operationId: get_get_nvd_sync_status
      parameters: []
      responses: {}
      summary: Get NVD sync status - how many vulnerabilities need syncing.
  /api/v1/vulnerabilities/sync:
    post:
      description: "\nSyncs vulnerabilities for all SBOM components in the system.\nThis is a long-running\
        \ operation that runs asynchronously.\n\nRequires maintainer role.\n\nRequest Body:\n    - component_ids:\
        \ Optional list of component IDs to sync (syncs all if not provided)\n    - force: Force re-sync\
        \ even if recently synced (default: false)\n\nReturns:\n    202: Sync initiated\n    400: Invalid\
        \ request\n    403: Insufficient permissions\n\nExample:\n    POST /api/v1/vulnerabilities/sync\n\
        \    {\n        \"component_ids\": [1, 2, 3],\n        \"force\": false\n    }"
      operationId: post_sync_vulnerabilities
      parameters: []
      responses: {}
      summary: Trigger vulnerability sync from OSV.dev and NVD.
