      responses: {}
      summary: List resource role assignments with optional filtering.
    post:
      description: "\nRequires maintainer role on the resource to grant roles.\n\nRequest Body:\n    {\n\
        \        \"identity_id\": 5 (optional),\n        \"group_id\": 3 (optional),\n        \"resource_type\"\
        : \"entity\",\n        \"resource_id\": 42,\n        \"role\": \"operator\"\n    }\n\nReturns:\n\
        \    201: Resource role created\n    400: Invalid request\n    403: License required or insufficient\
