  /api/v1/resource-roles/entities/{id}/roles:
    get:
      description: "\nPath Parameters:\n    - id: Entity ID\n\nReturns:\n    200: List of resource roles\
        \ for this entity\n    403: License required\n    404: Entity not found\n\nExample:\n    GET /api/v1/resource-roles/entities/42/roles\n\
        \    {\n        \"items\": [\n            {\n                \"id\": 1,\n                \"identity_id\"\
        : 5,\n                \"role\": \"maintainer\"\n            }\n        ],\n        \"total\":\
        \ 1\n    }"
      operationId: get_list_entity_roles
