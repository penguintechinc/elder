        \ Open Source Policy\",\n        \"organization_id\": 1,\n        \"description\": \"Approved\
        \ open source licenses\",\n        \"allowed_licenses\": [\"MIT\", \"Apache-2.0\", \"BSD-*\"],\n\
        \        \"denied_licenses\": [\"GPL-*\", \"AGPL-*\"],\n        \"action\": \"block\"\n    }"
