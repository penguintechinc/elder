        \  \"components\": [\n            {\n                \"name\": \"flask\",\n                \"\
        version\": \"2.0.0\",\n                \"license_name\": \"BSD-3-Clause\"\n            },\n  \
        \          {\n                \"name\": \"some-gpl-package\",\n                \"version\": \"\
        1.0.0\",\n                \"license_name\": \"GPL-3.0\"\n            }\n        ],\n        \"\
