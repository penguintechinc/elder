name: Continuous Integration

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '18'

permissions:
  contents: read
  security-events: write
  pull-requests: write
  packages: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.changes.outputs.python }}
      web: ${{ steps.changes.outputs.web }}
      rust: ${{ steps.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3
        id: changes
        with:
          filters: |
            python:
              - 'requirements.txt'
              - '**/*.py'
              - 'shared/**'
            web:
              - 'web/**'
              - 'package.json'
              - 'package-lock.json'
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'services/**'

  python-lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'schedule'

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements-dev.txt

    - name: Ruff format check
      run: ruff format --check apps/ shared/ scripts/ tests/

    - name: Ruff lint
      run: ruff check apps/ shared/ scripts/ tests/

    # mypy is gated by the lint-debt job (count ratchet against .lint-baseline);
    # the former soft-fail duplicate here could never fail and was removed.

  python-unit:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'schedule'

    # tests/unit relies on a real Postgres (PyDAL create_all() schema init,
    # JSON columns, etc. — see tests/conftest.py) and Redis (rate-limit/object
    # count keys, see tests/conftest.py::_reset_licensing_state) despite the
    # "unit" name; sqlite:///test.db (the previous, never-executed stub env)
    # does not work. Mirrors python-integration's service containers below.
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: elder_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: elder_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-bookworm
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Cache APT packages
      uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05  # v1.6.0
      with:
        packages: gcc libpq-dev libsasl2-dev libldap2-dev libssl-dev
        version: 1.0

    - name: Cache pip
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r apps/worker/requirements.txt

    - name: Run unit tests
      run: |
        pytest tests/unit -p no:warnings -q --no-header --cov-fail-under=64
      env:
        DATABASE_URL: postgresql://elder_test:test_password@localhost:55432/elder_test
        REDIS_URL: redis://localhost:56379/1
        LICENSE_KEY: PENG-TEST-TEST-TEST-TEST-ABCD
        PRODUCT_NAME: test-product

  python-integration:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'schedule'

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: elder_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: elder_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-bookworm
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Cache APT packages
      uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05  # v1.6.0
      with:
        packages: gcc libpq-dev libsasl2-dev libldap2-dev libssl-dev
        version: 1.0

    - name: Cache pip
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r apps/worker/requirements.txt

    - name: Run integration tests
      run: |
        pytest tests/integration -p no:warnings -q --no-header --cov-fail-under=21
      env:
        DATABASE_URL: postgresql://elder_test:test_password@localhost:55432/elder_test
        REDIS_URL: redis://localhost:56379/0
        SECRET_KEY: test-secret-key
        LICENSE_KEY: PENG-TEST-TEST-TEST-TEST-ABCD
        PRODUCT_NAME: test-product

  web-build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'schedule'

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install web dependencies
      run: cd web && npm ci --prefer-offline

    - name: TypeScript check
      run: cd web && npx tsc --noEmit

    - name: Build web application
      run: cd web && npm run build

    - name: Upload build artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
      with:
        name: web-build
        path: web/dist/
        retention-days: 7

  web-a11y-lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'schedule'

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install web dependencies
      run: cd web && npm ci --prefer-offline

    - name: eslint-plugin-jsx-a11y gate
      # Deterministic, unratcheted a11y gate — separate from lint-debt's counted
      # ratchet. eslint.config.js downgrades rules with pre-existing repo-wide
      # debt (label-has-associated-control, click-events-have-key-events, etc.)
      # to warn, so this currently exits 0 with 0 errors; any *new* violation of
      # a still-error-level jsx-a11y rule (or a regression elsewhere) fails the
      # build immediately, letting eslint's own exit code gate rather than a count.
      run: cd web && npx eslint . --ext ts,tsx --report-unused-disable-directives

  lint-debt:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true' || github.event_name == 'schedule'

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install lint toolchain
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements-dev.txt

    - name: Install web dependencies
      run: cd web && npm ci --prefer-offline

    - name: Lint debt ratchet
      # Fails if mypy/shellcheck/prettier/eslint findings rise above .lint-baseline.
      # shellcheck is preinstalled on ubuntu-latest runners.
      env:
        VENV_PY: python
      run: bash scripts/lint-debt.sh

  docker-smoke:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'schedule'

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

    - name: Build API image (amd64, no push)
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
      with:
        context: .
        file: apps/api/Dockerfile
        platforms: linux/amd64
        push: false
        load: true
        tags: elder/hub-api:ci-test
        cache-from: type=gha,scope=api-amd64
        cache-to: type=gha,mode=max,scope=api-amd64
        build-args: |
          APP_VERSION=ci-test
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

    - name: Smoke test — import check
      run: docker run --rm elder/hub-api:ci-test python3 -c "import apps.api.main; print('Import OK')"

  rust-check:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'schedule'

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Ensure Rust toolchain (rust-toolchain.toml)
      run: |
        rustup show active-toolchain
        rustc --version
        cargo --version

    - name: Cache Cargo dependencies
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Rust formatting check
      run: cargo fmt --all -- --check

    - name: Rust clippy lint
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Rust unit tests
      run: cargo test --workspace --locked

    - name: Docker build + healthcheck smoke (Rust services)
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

    - name: Build svc-scanner image and run healthcheck
      run: |
        docker build -f services/svc-scanner/Dockerfile -t elder/svc-scanner:ci-test .
        docker run --rm \
          -e ELDER_API_URL=http://localhost:5000 \
          -e JWT_SECRET_KEY=ci-test-secret-key-at-least-32-bytes \
          elder/svc-scanner:ci-test healthcheck

    - name: Build svc-integrations image and run healthcheck
      run: |
        docker build -f services/svc-integrations/Dockerfile -t elder/svc-integrations:ci-test .
        docker run --rm \
          -e ELDER_API_URL=http://localhost:5000 \
          -e JWT_SECRET_KEY=ci-test-secret-key-at-least-32-bytes \
          elder/svc-integrations:ci-test healthcheck

  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    # Report-only SARIF export (all severities) for the Security tab; the
    # gating Trivy run is in `make audit` below.
    - name: Trivy SARIF report
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        trivy-version: 'v0.69.3'
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Security audit gate (trivy HIGH/CRITICAL, semgrep ERROR, gitleaks)
      # Same script as `make audit` locally. Accepted exceptions live in
      # .trivyignore, trivy-secret.yaml and .gitleaksignore — no soft-fail.
      run: bash scripts/audit.sh

    - name: Initialize CodeQL
      uses: github/codeql-action/init@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4
      with:
        languages: 'python,javascript'
        config-file: ./.github/codeql/codeql-config.yml

    - name: Autobuild
      uses: github/codeql-action/autobuild@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4

  openapi-drift:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'schedule'

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Regenerate openapi/v4.yaml and fail on drift
      # Builds elder-test:3.13, starts the test Postgres/Redis containers and
      # runs scripts/generate_openapi_spec.py, then `git diff --exit-code openapi/`.
      # The elder-test image runs as a non-runner UID, so let it overwrite the
      # bind-mounted spec file.
      run: |
        chmod a+w openapi/v4.yaml
        make openapi-check

  release-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Chart.yaml / .version / CHANGELOG consistency
      # release -> main PRs cut a version, so they must also carry the
      # CHANGELOG `## [X.Y.Z]` section; other refs only need [Unreleased].
      env:
        RELEASE_PR: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'release/') }}
      run: |
        if [ "$RELEASE_PR" = "true" ]; then
          bash scripts/release-check.sh --release
        else
          bash scripts/release-check.sh
        fi

  license-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Check license integration
      run: |
        grep -r "license.penguintech.io" . --exclude-dir=.git --exclude-dir=node_modules || true
        grep -r "PENG-" . --exclude-dir=.git --exclude-dir=node_modules || true
        python3 -c "import penguin_licensing" 2>/dev/null || echo "penguin-licensing not installed (checked at runtime)"
        echo "License integration check passed"

  # OSS dependency license compliance — Elder is AGPL-3.0 (LICENSE.md); this
  # is distinct from license-check above (product entitlement wiring).
  license-check-deps:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true' || github.event_name == 'schedule'

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Cache APT packages
      # python-ldap (requirements.txt) has no prebuilt wheel and compiles
      # against lber.h — same packages python-unit/python-integration install
      # before their pip install, needed here too now that setup-python below
      # builds the full requirements.txt tree.
      uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05  # v1.6.0
      with:
        packages: gcc libpq-dev libsasl2-dev libldap2-dev libssl-dev
        version: 1.0

    - name: Install Python dependency tree + pip-licenses
      # license-check-deps (Makefile) shells out to $(VENV)/bin/pip-licenses —
      # it needs packages installed into .venv, not the bare system/action
      # python env `pip install` above used to populate. `make setup-python`
      # creates .venv and installs both requirements.txt (the shipped
      # dependency tree being license-checked) and requirements-dev.txt
      # (which pins pip-licenses==5.5.5) with --require-hashes. The target
      # additionally scans the apps/{worker,mcp} lock files, each in a
      # throwaway venv it creates at run time (those trees pin conflicting
      # versions and cannot share .venv) — the apt build deps cached above
      # cover their compiled dependencies too.
      run: make setup-python

    - name: Install web dependencies
      run: cd web && npm ci --prefer-offline

    - name: Check dependency licenses (Python + npm)
      run: make license-check-deps

  ci-summary:
    runs-on: ubuntu-latest
    needs: [python-lint, lint-debt, python-unit, python-integration, web-build, web-a11y-lint, rust-check, docker-smoke, security, openapi-drift, release-check, license-check, license-check-deps]
    if: always()
    permissions:
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
      continue-on-error: true

    - name: Generate summary
      env:
        R_LINT: ${{ needs.python-lint.result }}
        R_LINT_DEBT: ${{ needs.lint-debt.result }}
        R_UNIT: ${{ needs.python-unit.result }}
        R_INTEGRATION: ${{ needs.python-integration.result }}
        R_WEB: ${{ needs.web-build.result }}
        R_A11Y: ${{ needs.web-a11y-lint.result }}
        R_RUST: ${{ needs.rust-check.result }}
        R_DOCKER: ${{ needs.docker-smoke.result }}
        R_SECURITY: ${{ needs.security.result }}
        R_OPENAPI: ${{ needs.openapi-drift.result }}
        R_RELEASE: ${{ needs.release-check.result }}
        R_LICENSE: ${{ needs.license-check.result }}
        R_LICENSE_DEPS: ${{ needs.license-check-deps.result }}
        BRANCH: ${{ github.ref_name }}
        COMMIT: ${{ github.sha }}
        RUN_NUM: ${{ github.run_number }}
      run: |
        cat > ci-summary.md <<EOF
        # CI Summary

        ## Job Results
        - Python Lint: ${R_LINT}
        - Lint Debt Ratchet: ${R_LINT_DEBT}
        - Python Unit: ${R_UNIT}
        - Python Integration: ${R_INTEGRATION}
        - Web Build: ${R_WEB}
        - Web A11y Lint: ${R_A11Y}
        - Rust (svc-scanner, svc-integrations): ${R_RUST}
        - Docker Smoke: ${R_DOCKER}
        - Security: ${R_SECURITY}
        - OpenAPI Drift: ${R_OPENAPI}
        - Release Consistency: ${R_RELEASE}
        - License: ${R_LICENSE}
        - OSS Dependency Licenses: ${R_LICENSE_DEPS}

        **Branch:** ${BRANCH} | **Commit:** ${COMMIT} | **Run:** #${RUN_NUM}
        EOF

    - name: Upload summary artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
      with:
        name: ci-summary
        path: ci-summary.md
        retention-days: 30

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('ci-summary.md', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body
          });

    - name: Fail if required jobs failed
      if: |
        needs.python-lint.result == 'failure' ||
        needs.lint-debt.result == 'failure' ||
        needs.web-build.result == 'failure' ||
        needs.web-a11y-lint.result == 'failure' ||
        needs.rust-check.result == 'failure' ||
        needs.docker-smoke.result == 'failure' ||
        needs.license-check-deps.result == 'failure'
      run: |
        echo "One or more required jobs failed"
        exit 1
